<title>Planner 2.8</title>
<script>try{var k=localStorage.getItem("p28:ui:look");if(/^(mist|sage|dawn|slate|night)$/.test(k||""))document.documentElement.setAttribute("data-look",k);}catch(e){}</script>
<style>
/* ===== Planner 2.7 stylesheet (stage 2). Tokens = reviewed token sheet, light block (dark is not activated in v1, P2-15).
   Deviation from the sheet, on the orchestrator's instruction: nothing under 12px (sheet had 11px meta/tab). ===== */
:root{
 --bg:#efe8da; --paper:#fcfaf5; --paper-2:#f7f1e6; --col:#f7f1e6;
 --col-today:#fbf3e8; --col-pool:#f6eed8;
 --hair:#e3d9c4; --hair-2:#efe7d6; --edge:#b9ab92; --ring:#9a806a; --focus:#2c2722;
 --ink:#2c2722; --ink-2:#4a4136; --muted:#6b6152; --faint:#6b6152; --done:#766c5d;
 --p:#bd5f37; --p-ink:#a84f29; --p-wash:#f7ece2; --p-line:#e7c7ad; --on-p:#ffffff;
 --w:#557785; --w-ink:#46687a; --w-wash:#e9f0f2; --w-line:#c7dbe1;
 --good:#4e8a5a; --good-ink:#356b41; --good-wash:#e7f0e7;
 --gold:#85601c; --gold-ink:#85601c; --gold-wash:#f6eed8; --gold-line:#e6d5ae;
 --late-ink:#8f4a20; --late-wash:#f3ddc9;
 --claude:#6a4d7e; --claude-ink:#6a4d7e; --claude-wash:#efe9f3; --claude-line:#ddcfe7; --claude-prop:#faf7fc;
 --hatch-a:#efe7d6; --hatch-b:#f4eddf;
 --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
 --r-s:8px; --r-m:12px; --r-l:16px; --r-pill:999px; --r-row:10px; --r:16px;
 --shadow-1:0 1px 2px rgba(70,52,28,.05); --shadow-2:0 2px 4px rgba(70,52,28,.06),0 10px 26px rgba(70,52,28,.10); --shadow-3:0 14px 40px rgba(70,52,28,.16);
 --tabh:56px; --addh:60px; --chiph:0px;
 --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
 --ease:cubic-bezier(.4,0,.2,1); --on-ink:#ffffff; --raise:#ffffff; --scrim:rgba(44,39,34,.32);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{color:var(--ink);background:var(--bg);min-height:100dvh;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
a{color:var(--w-ink)}
::selection{background:var(--p-line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100dvh}
#frame{container-type:inline-size;container-name:app;width:100%;flex:1;display:flex;flex-direction:column;min-width:0}
#main{flex:1;width:100%;min-width:0}
.wrap{width:100%;margin:0 auto;padding:0 16px}
#lapnav,#lapbar{display:none}
body[data-lay="lap"] #tabbar,body[data-lay="lap"] #addbar,body[data-lay="lap"] #chipbar{display:none!important}
body[data-lay="phone"] #main{padding-top:calc(var(--sat) + 4px);padding-bottom:calc(var(--tabh) + var(--sab) + 16px)}
body[data-lay="phone"].v-today #main{padding-bottom:calc(var(--tabh) + var(--addh) + var(--sab) + 16px)}
body[data-lay="phone"].v-weekplus #main,body[data-lay="phone"].v-week #main{padding-bottom:calc(var(--tabh) + var(--addh) + 62px + var(--sab) + 16px)}

/* laptop chrome: nav 48 + bar 48 */
body[data-lay="lap"] #lapnav{display:flex;align-items:center;gap:16px;height:48px;padding:0 24px;flex:0 0 auto}
.brand{font-size:15px;font-weight:740;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .mk{width:22px;height:22px;border-radius:7px;background:var(--p-ink);display:grid;place-items:center;color:var(--on-ink);font-size:12px;font-weight:800}
.brand .ver{font-size:12px;font-weight:650;color:var(--muted)}
.lnav{display:flex;gap:2px;background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:3px}
.lnav button{font-size:13px;font-weight:650;color:var(--muted);padding:0 14px;height:32px;border-radius:9px;white-space:nowrap;display:inline-flex;align-items:center}
.lnav button:hover{color:var(--ink)}
.lnav button.on{background:var(--ink);color:var(--on-ink)}
.lnav .tworow{padding:0;width:32px;justify-content:center;margin-left:-2px}
.lnav .tworow svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.lapright{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0}
.synced{font-size:12px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 8px;border-radius:9px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.synced .d{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--edge)}
.synced.fault{color:var(--late-ink);background:var(--late-wash)}
body[data-lay="lap"] .synced:hover{background:var(--paper)}
@media (max-width:1000px){ .brand .bt{display:none} body[data-lay="lap"] #lapnav{gap:10px;padding:0 16px} .lnav button{padding:0 10px} }

body[data-lay="lap"] #lapbar{display:flex;align-items:center;gap:16px;height:48px;padding:0 24px;flex:0 0 auto}
body[data-lay="lap"]:not(.v-today):not(.v-weekplus):not(.v-week) #lapbar{display:none}
body[data-lay="lap"].v-today #lapbar{width:100%;max-width:808px;margin:0 auto}
.lapadd{display:flex;gap:8px;align-items:center;flex:0 1 440px;min-width:240px}
body.v-today .lapadd{flex:1 1 auto}
.kindseg{flex:0 0 auto;display:flex;background:var(--paper);border:1px solid var(--hair);border-radius:10px;overflow:hidden;padding:2px;gap:2px}
.kindseg button{font-size:12px;font-weight:700;padding:0 10px;height:30px;border-radius:7px;color:var(--muted)}
.kindseg button.on[data-k="personal"]{background:var(--p-ink);color:var(--on-ink)}
.kindseg button.on[data-k="work"]{background:var(--w-ink);color:var(--on-ink)}
#lapnew,#newtask{flex:1;min-width:0;height:36px;background:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:0 12px;font-size:14px}
#lapnew:focus,#newtask:focus{outline:2px solid var(--focus);outline-offset:1px}
#lapnew::placeholder,#newtask::placeholder{color:var(--muted);opacity:1}
.addgo{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--on-ink);font-size:22px;font-weight:400;line-height:1;display:grid;place-items:center}
.lapadd .addgo{visibility:hidden}
.lapadd.has .addgo{visibility:visible}
#lapslot{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px}
body.v-today #lapslot{display:none}

/* week bar pieces (laptop slot + phone header) */
.rng{font-size:18px;font-weight:740;letter-spacing:-.01em;white-space:nowrap;margin-right:auto;overflow:hidden;text-overflow:ellipsis}
.rng small{font-size:12px;font-weight:650;color:var(--muted);margin-left:8px}
.hb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 10px;border-radius:9px;background:var(--paper);border:1px solid var(--hair);font-size:13px;font-weight:650;color:var(--ink-2);white-space:nowrap}
.hb svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hb.icon{padding:0;width:32px}
.hb:hover{color:var(--ink);border-color:var(--edge)}
.hb[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.hb.gold{background:var(--gold-wash);border-color:var(--gold-line);color:var(--gold-ink)}
.hb.claude{background:var(--claude-wash);border-color:var(--claude-line);color:var(--claude-ink)}
.hb.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
body[data-lay="phone"] .hb{height:44px;min-width:44px;border-radius:12px;font-size:14px}
body[data-lay="phone"] .hb.icon{width:44px}
.linkbtn{font-size:13px;font-weight:650;color:var(--w-ink);text-decoration:underline;text-underline-offset:3px;min-height:32px;padding:0 2px}
body[data-lay="phone"] .linkbtn{min-height:44px;display:inline-flex;align-items:center}
.linkbtn.claude{color:var(--claude-ink)}

/* phone header row */
.phead{display:flex;align-items:center;gap:6px;padding:8px 44px 8px 0;min-height:56px}
.phead .rng{font-size:20px}
.chipslot{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.chipslot:empty{display:none}
#phsync{position:fixed;top:calc(var(--sat) + 8px);right:0;z-index:45;width:44px;height:44px;padding:0;justify-content:center;background:none}
#phsync.fault{position:static;width:auto;height:auto;min-height:44px;margin:8px 16px 0;padding:8px 12px;border-radius:12px;display:flex;white-space:normal;justify-content:flex-start;font-size:13px}
#phsync.fault .sr{position:static;width:auto;height:auto;clip:auto;white-space:normal}

/* page headings (Today, Time, Review, More, legacy pages) */
.dayhead{padding:12px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
body[data-lay="phone"] .dayhead{padding-right:44px}
.dayhead .dow{font-size:30px;font-weight:740;letter-spacing:-.02em;line-height:1.05}
.dayhead .date{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.dayhead .date b{color:var(--ink-2);font-weight:700}
.headright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.donechip{font-size:13px;font-weight:700;color:var(--good-ink);background:var(--good-wash);border-radius:999px;padding:4px 12px;white-space:nowrap}
.lapwrap{max-width:760px;margin:0 auto;padding:8px 24px 48px}
body[data-lay="phone"] .lapwrap{padding:0 0 8px}
.lapwrap.grid2{max-width:1200px}
.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:760;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.eyebrow.p{color:var(--p-ink)} .eyebrow.w{color:var(--w-ink)} .eyebrow.claude{color:var(--claude-ink)} .eyebrow.gold{color:var(--gold-ink)}
.eyebrow .ln{flex:1;height:1px;background:var(--hair)}
.addmini{color:var(--ink-2);font-weight:650;font-size:13px;letter-spacing:0;text-transform:none;padding:0 10px;min-height:32px;border-radius:9px;background:var(--paper);border:1px solid var(--hair);white-space:nowrap}
body[data-lay="phone"] .addmini{min-height:44px;padding:0 12px}
.empty{text-align:center;color:var(--muted);padding:24px 16px;font-size:13px}
.empty .ic{display:none} .empty .h{font-size:15px;color:var(--ink-2);font-weight:650;margin:0 0 4px}
.softrow{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.softbtn{flex:1;min-width:0;background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:var(--shadow-1);min-height:44px;display:block;color:inherit;text-decoration:none}
.softbtn:hover{border-color:var(--edge)}
.softbtn .h{font-size:14px;font-weight:650} .softbtn .s{font-size:12px;color:var(--muted);margin-top:2px}
.showfull{width:100%;margin:12px 0 4px;background:none;border:1px dashed var(--edge);border-radius:12px;min-height:44px;padding:8px 12px;color:var(--ink-2);font-weight:650;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}
.showfull svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none;transition:transform .18s var(--ease)}
.showfull.open svg{transform:rotate(180deg)}
.card{background:var(--paper);border:1px solid var(--hair);border-radius:16px;padding:16px;box-shadow:var(--shadow-1);min-width:0}
.card > .eyebrow:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
body[data-w="wide"] .cards,body[data-w="laptop"] .cards{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cards .colstack{display:flex;flex-direction:column;gap:16px;min-width:0}
.muted{color:var(--muted)} .small{font-size:12px}
.note{font-size:13px;color:var(--muted);line-height:1.5}

/* ---------- task row ---------- */
.list{display:flex;flex-direction:column;gap:4px;min-height:2px}
.t{position:relative;display:flex;align-items:center;gap:6px;min-height:37px;padding:0 4px 0 10px;background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-row);box-shadow:var(--shadow-1);min-width:0;-webkit-touch-callout:none}
.t::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--p)}
.t.kwork::before{background:var(--w)}
.t.plain::before{display:none}
.t .lab{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;padding:3px 0;cursor:pointer;font-size:13px;line-height:17px;font-weight:560;border-radius:6px}
.t .lab .lt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.t .lab .lt[data-num]::before{content:attr(data-num) ". ";color:var(--muted);font-weight:700}
.t .subdesc,.subdesc{display:block;font-size:12px;color:var(--muted);font-weight:540;margin-top:2px}
.check{flex:0 0 auto;width:28px;height:28px;margin-left:-4px;display:grid;place-items:center;border-radius:50%}
.check i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ring);background:var(--paper);display:grid;place-items:center;transition:background .12s,border-color .12s}
.check svg{width:60%;height:60%;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check:hover i{border-color:var(--good)}
.t.done{background:var(--paper-2);box-shadow:none;min-height:29px}
.t.done .lab{color:var(--done);text-decoration:line-through}
.t.done .lab .lt{-webkit-line-clamp:1}
.t.done .check i,.check.done i{background:var(--good);border-color:var(--good);width:16px;height:16px}
.t.done .check svg,.check.done svg{opacity:1}
.t.done::before{opacity:.5}
.pill{flex:0 0 auto;font-size:12px;font-weight:700;border-radius:8px;padding:0 6px;line-height:18px;white-space:nowrap;color:var(--muted);background:var(--paper-2);border:1px solid var(--hair)}
.pill.subs{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:24px;cursor:pointer}
.pill.subs.alldone{color:var(--good-ink);background:var(--good-wash);border-color:transparent}
.pill.claude{color:var(--claude-ink);background:var(--claude-wash);border-color:var(--claude-line);text-decoration:none}
.pill.remind{color:var(--gold-ink);background:var(--gold-wash);border-color:var(--gold-line)}
.pill.remind.over{color:var(--late-ink);background:var(--late-wash);border-color:transparent}
.pill.tag{font-weight:600}
.rbell{flex:0 0 auto;width:16px;height:16px;stroke:var(--gold-ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mvbtn{flex:0 0 auto;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.mvbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mvbtn:hover{background:var(--paper-2);color:var(--ink)}
.grip{display:none;flex:0 0 auto;width:12px;margin-left:-6px;color:var(--edge);text-align:center;cursor:grab;touch-action:none;font-size:12px;line-height:1;user-select:none}
@media (hover:hover) and (pointer:fine){
  .t .mvbtn{opacity:.45}
  .t:hover .mvbtn,.t .mvbtn:focus-visible{opacity:1}
  .t:hover{background:var(--raise);box-shadow:var(--shadow-2)}
  .t.done:hover{background:var(--paper-2);box-shadow:none}
  body[data-lay="lap"] .bcol .grip{display:block;opacity:0}
  body[data-lay="lap"] .bcol .t:hover .grip{opacity:1}
}
.t.dragging{box-shadow:var(--shadow-3);opacity:.95;z-index:30;cursor:grabbing;pointer-events:none}
.t.dropflash{animation:dropflash .24s ease-out 1}
@keyframes dropflash{0%{box-shadow:0 0 0 3px var(--edge) inset}100%{box-shadow:none}}
.t.seled{outline:2px solid var(--ink);outline-offset:-2px}
.drag-hidden{display:none!important}
/* touch sizes: 48px rows, 44px controls */
body[data-lay="phone"] .t,body[data-touch="1"] .t{min-height:48px;border-radius:12px;padding:0 0 0 10px}
body[data-lay="phone"] .t .lab,body[data-touch="1"] .t .lab{font-size:15px;line-height:20px}
body[data-lay="phone"] .check,body[data-touch="1"] .check{width:44px;height:44px;margin-left:-8px}
body[data-lay="phone"] .check i,body[data-touch="1"] .check i{width:24px;height:24px}
body[data-lay="phone"] .t.done,body[data-touch="1"] .t.done{min-height:44px}
body[data-lay="phone"] .t.done .check i,body[data-touch="1"] .t.done .check i{width:20px;height:20px}
body[data-lay="phone"] .mvbtn,body[data-touch="1"] .mvbtn{width:44px;height:44px;opacity:1}
body[data-lay="phone"] .mvbtn svg,body[data-touch="1"] .mvbtn svg{width:20px;height:20px}
body[data-lay="phone"] .pill.subs,body[data-touch="1"] .pill.subs{min-width:44px;min-height:44px;background:none;border-color:transparent;font-size:13px}
body[data-lay="phone"] .list{gap:6px}
/* sub-tasks (expanded) */
.subs{margin:0 0 2px 14px;border-left:2px solid var(--hair);padding:2px 0 2px 8px;display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:center;gap:6px;min-height:22px;font-size:12px;color:var(--ink-2)}
.sub .lab{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:540;line-height:16px}
.sub .lab[data-ltr]::before{content:attr(data-ltr) ". ";font-weight:700;color:var(--muted)}
.sub.done .lab{text-decoration:line-through;color:var(--done)}
.subcheck{flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center}
.subcheck i{width:16px;height:16px;border-radius:5px;border:2px solid var(--ring);background:var(--paper);display:grid;place-items:center}
.subcheck svg{width:70%;height:70%;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.sub.done .subcheck i{background:var(--good);border-color:var(--good)} .sub.done .subcheck svg{opacity:1}
.sub .x{flex:0 0 auto;color:var(--muted);width:22px;height:22px;display:grid;place-items:center;font-size:15px;border-radius:6px}
.sub.add{color:var(--ink-2);font-weight:650;justify-content:flex-start;gap:6px;min-height:24px;padding-left:2px}
body[data-lay="phone"] .sub,body[data-touch="1"] .sub{min-height:44px;font-size:14px}
body[data-lay="phone"] .subcheck,body[data-lay="phone"] .sub .x,body[data-touch="1"] .subcheck,body[data-touch="1"] .sub .x{width:44px;height:44px}
body[data-lay="phone"] .subcheck i,body[data-touch="1"] .subcheck i{width:20px;height:20px}
body[data-lay="phone"] .sub.add,body[data-touch="1"] .sub.add{min-height:44px}
/* appointments (read-only) */
.appts{display:flex;flex-direction:column;gap:4px;margin:0 0 6px}
.appt{display:flex;align-items:center;gap:8px;background:var(--w-wash);border-left:3px solid var(--w);border-radius:8px;padding:3px 8px;min-height:24px}
.appt-t{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--w-ink)}
.appt-l{flex:1;min-width:0;font-size:12px;font-weight:560;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appt-loc{display:none}
body[data-lay="phone"] .appt{min-height:32px} body[data-lay="phone"] .appt-l{font-size:13px}

/* ---------- Week+ board ---------- */
body[data-lay="lap"].v-weekplus #app{height:100dvh;min-height:0;overflow:hidden}
body[data-lay="lap"].v-weekplus #frame{min-height:0}
body[data-lay="lap"].v-weekplus #main{min-height:0;display:flex;overflow:hidden}
body[data-lay="lap"].v-weekplus .wrap{padding:0 24px 16px;height:100%;min-height:0}
body[data-lay="lap"].v-weekplus #view{height:100%;min-height:0}
body[data-lay="lap"].v-week .wrap{padding:0 24px 32px}
.board{display:flex;gap:8px;height:100%;min-width:0}
.bcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--col);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.bcol.pool{flex:0 0 240px}
body[data-w="wide"] .bcol.pool{flex-basis:280px} body[data-w="wide"] .bcol.wkd{flex:0 0 230px} body[data-w="wide"] .bcol.nxt{flex:0 0 250px}
body[data-w="tablet"] .bcol.pool{flex-basis:260px}
/* p12: the Weekend arrangement (laptop and wide): open columns share the width (Either day a double share while it holds the most); a folded one is the 44px strip at every width; while a task is dragged, the folded strip of days gone by takes no part */
body[data-lay="lap"] .board > .bcol.wke:not(.tab){flex:1 1 0}
body[data-lay="lap"] .board > .bcol.wke.wke2:not(.tab){flex:2 1 0}
body[data-lay="lap"] .board > .bcol.wke.tab{flex:0 0 44px}
body[data-lay="lap"] .board > .bcol.wke.tab.dropt{flex-basis:200px}
body[data-lay="lap"] .board:has(> .bcol.wke):has(.t.dragging) > .bcol.past.tab{pointer-events:none}
.bcol.today{background:var(--col-today);border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.bhead{display:flex;align-items:center;gap:6px;padding:8px 6px 6px 12px;min-height:40px;flex:0 0 auto}
.bhead .dw{font-size:14px;font-weight:740;white-space:nowrap}
.bhead .nn{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead .left{margin-left:auto;font-size:12px;font-weight:700;color:var(--p-ink);white-space:nowrap}
.bcol.pool .bhead .dw{color:var(--gold-ink)}
.bcol.today .bhead .dw{color:var(--p-ink)}
.bhead .colbtn{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:18px;line-height:1;opacity:0}
.bhead .left + .colbtn{margin-left:0}
.bcol:hover .colbtn,.colbtn:focus-visible{opacity:1}
.colbtn:hover{background:var(--paper);color:var(--ink)}
.bbody{flex:1;min-height:0;overflow-y:auto;padding:0 8px 8px;scrollbar-width:thin}
.sec + .sec{margin-top:8px}
.sechead{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2);padding:6px 4px 4px}
.sechead .nn{font-weight:600;color:var(--muted)}
.sec.today > .sechead{color:var(--p-ink)}
.lanelab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:760;margin:8px 4px 4px;color:var(--p-ink)}
.lanelab.w{color:var(--w-ink)}
.list + .list:not(:empty){margin-top:4px}
.sec .t.done{display:none}
.sec.showdone .t.done{display:flex}
.sec .t.done + .subs{display:none}
.sec.showdone .t.done + .subs{display:flex}
.donefold{display:flex;align-items:center;gap:6px;width:100%;min-height:28px;margin-top:4px;padding:0 6px;font-size:12px;font-weight:650;color:var(--muted);border-radius:8px}
.donefold svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none;transition:transform .18s var(--ease)}
.sec.showdone .donefold svg{transform:rotate(90deg)}
.donefold:hover{background:var(--paper)}
body[data-lay="phone"] .donefold{min-height:44px;font-size:13px}
.nothing{font-size:12px;color:var(--muted);padding:6px 4px}
.sortlink{font-size:12px;font-weight:650;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-left:auto;white-space:nowrap}
.sortlink + .colbtn{margin-left:0}
/* collapsed column = 44px tab */
.bcol.tab{flex:0 0 44px;cursor:pointer;align-items:center;transition:flex-basis .18s var(--ease)}
.bcol.tab .bbody,.bcol.tab .colbtn,.bcol.tab .sortlink,.bcol.tab .left{display:none}
.bcol.tab .bhead{writing-mode:vertical-rl;padding:12px 0;min-height:0;gap:8px;flex:1 1 auto;align-items:center;justify-content:flex-start;width:100%}
.bcol.tab .tabn{writing-mode:horizontal-tb;font-size:12px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--hair);border-radius:8px;min-width:24px;text-align:center;padding:0 4px;line-height:20px}
.bcol:not(.tab) .tabn{display:none}
.bcol.tab:hover{border-color:var(--edge)}
.bcol.tab.dropt{flex-basis:200px;align-items:stretch;border:2px dashed var(--ink-2)}
.bcol.tab.dropt .bhead{writing-mode:horizontal-tb;flex:0 0 auto;padding:8px 6px 6px 12px}
.bcol.tab.dropt .bbody{display:block}
.bcol.dropt:not(.tab){outline:2px dashed var(--ink-2);outline-offset:-2px}
/* two-row week */
.board2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:start}
.board2 + .board2{margin-top:8px}
.board2 .bcol{min-height:120px}
.board2 .bbody{max-height:60vh}
.weeklabel{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:760;color:var(--muted);margin:12px 4px 6px}
/* phone: one bucket at a time */
body[data-lay="phone"] .board{display:block;height:auto}
body[data-lay="phone"] .board .bcol{display:none;background:none;border:none;border-radius:0;overflow:visible;box-shadow:none}
body[data-lay="phone"] .board .bcol.sel{display:block}
body[data-lay="phone"] .board .bbody{padding:0;overflow:visible}
body[data-lay="phone"] .board .bhead{padding:4px 0 8px;min-height:0}
body[data-lay="phone"] .board .bhead .dw{font-size:17px}
body[data-lay="phone"] .bhead .colbtn{display:none}
body[data-lay="phone"] .sortlink{min-height:44px;display:inline-flex;align-items:center;font-size:13px}
/* phone: old sideways view */
body[data-lay="phone"] .board.snap{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 8px}
body[data-lay="phone"] .board.snap .bcol{display:flex;flex:0 0 78vw;scroll-snap-align:start;background:var(--col);border:1px solid var(--hair);border-radius:16px;padding:8px}
body[data-lay="phone"] .board.snap .bcol.today{background:var(--col-today);border-color:var(--p)}
/* phone chip strip, directly above the Add field */
#chipbar{display:none}
body[data-lay="phone"].v-weekplus:not(.snapview) #chipbar{display:flex;position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--addh) + var(--sab));z-index:41;gap:3px;padding:6px 8px 0;background:var(--bg);border-top:1px solid var(--hair)}
.chip{flex:1 0 44px;min-width:44px;height:56px;border-radius:12px;background:var(--paper);border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.chip .d{font-size:12px;font-weight:700;color:var(--muted);line-height:14px}
.chip .n{font-size:15px;font-weight:740;line-height:18px}
.chip.word .d{font-size:13px;color:var(--ink-2)}
.chip.pool .d{color:var(--gold-ink)}
.chip.today{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.chip.sel{background:var(--ink);border-color:var(--ink);box-shadow:none}
.chip.sel .d,.chip.sel .n{color:var(--on-ink)}
/* phone add bar + tab bar */
#addbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + var(--sab));z-index:40;height:var(--addh);padding:8px;background:var(--bg)}
body[data-lay="phone"]:not(.v-today):not(.v-weekplus):not(.v-week) #addbar{display:none}
.addrow{display:flex;gap:6px;align-items:center}
#addbar .kindseg{padding:0;border-radius:12px}
#addbar .kindseg button{height:44px;min-width:44px;padding:0 8px;border-radius:10px}
#addbar #newtask{height:44px;font-size:16px;border-radius:12px;padding:0 10px}
#addbar .addgo{width:44px;height:44px;border-radius:12px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--tabh) + var(--sab));padding-bottom:var(--sab);background:var(--paper);border-top:1px solid var(--hair);display:flex}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab .tl{font-size:12px;font-weight:650}
.tab.on{color:var(--p-ink)}

/* ---------- Today ---------- */
.todaywrap{max-width:760px;margin:0 auto}
body[data-lay="lap"] .todaywrap{padding:0 24px 48px}
.next{position:relative;background:var(--paper);border:1px solid var(--hair);border-radius:16px;padding:16px 16px 12px 20px;box-shadow:var(--shadow-2);overflow:hidden}
.next::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--p)}
.next.kwork::before{background:var(--w)}
.next .lane{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:760;color:var(--p-ink)}
.next.kwork .lane{color:var(--w-ink)}
.next .row{display:flex;align-items:flex-start;gap:12px;margin-top:8px}
.next .title{font-size:20px;font-weight:680;line-height:26px;padding:9px 0;flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;border-radius:6px}
.next .check{width:44px;height:44px;margin:0 0 0 -8px}
.next .check i{width:30px;height:30px;border-width:2.5px}
.next .step{margin:2px 0 0 48px;font-size:14px;color:var(--ink-2);font-weight:600;overflow-wrap:anywhere}
.next .step b{color:var(--muted);font-weight:700}
.next .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.clearday{border:1px dashed var(--edge);border-radius:16px;padding:24px 16px;text-align:center;color:var(--muted)}
.clearday .h{font-size:17px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.driver{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:12px 0 0;padding:8px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--hair);min-height:44px;font-size:13px;color:var(--ink-2)}
.driver b{font-weight:700;color:var(--ink)} .driver .go{margin-left:auto;color:var(--muted)}

/* ---------- Time ---------- */
.timewrap{max-width:760px;margin:0 auto}
body[data-lay="lap"] .timewrap{padding:8px 24px 48px}
.timehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0}
body[data-lay="phone"] .timehead{padding-right:44px}
.timehead .ttl{font-size:22px;font-weight:740;margin-right:auto;white-space:nowrap}
.timehead .ttl small{font-size:14px;font-weight:650;color:var(--muted);margin-left:8px}
.nowline{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 12px}
.timetools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.rail{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:8px;align-items:stretch}
.seg .gut{flex:0 0 48px;font-size:12px;font-weight:650;color:var(--muted);display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding:8px 0}
body[data-lay="phone"] .seg .gut{flex-basis:40px}
.seg .body{flex:1;min-width:0}
.wt{background:var(--paper);border:1px solid var(--hair);border-left:3px solid var(--ink-2);border-radius:12px;padding:0 8px 8px;box-shadow:var(--shadow-1)}
.wt.now{border-left-color:var(--p)}
.wt .wth{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:760;color:var(--muted);text-align:left;padding:0 4px}
.wt .wth .tm{margin-left:auto;letter-spacing:0;font-weight:700;color:var(--ink-2);text-transform:none;font-size:13px}
body[data-lay="phone"] .wt .wth{min-height:44px}
.wt .list{gap:4px}
.wt .t.frompool{background:var(--paper-2);box-shadow:none}
.wt .t.frompool .lab{color:var(--ink-2)}
.wt .empty{padding:12px 8px;text-align:left}
.wt.prop{background:var(--claude-prop);border:1px dashed var(--claude-ink);border-left-width:3px}
.brk{width:100%;text-align:left;min-height:36px;border:1px dashed var(--edge);border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);
  background:repeating-linear-gradient(135deg,var(--hatch-a) 0 6px,var(--hatch-b) 6px 12px)}
.brk b{font-weight:700;color:var(--muted)}
.brk .why{color:var(--muted);font-weight:540}
body[data-lay="phone"] .brk{min-height:44px}
.edge{font-size:12px;color:var(--muted);padding:2px 0 2px 56px;min-height:24px;display:flex;align-items:center}
body[data-lay="phone"] .edge{padding-left:48px}
.mtg{display:flex;gap:8px;align-items:center;min-height:28px;padding:0 8px;border-radius:8px;background:var(--hair-2);font-size:12px;color:var(--ink-2);margin-bottom:4px}
.mtg b{font-weight:700}
.estrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 4px 8px 12px;font-size:12px;color:var(--muted)}
.propbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--claude-wash);border:1px solid var(--claude-line);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.propbar .sp{margin-left:auto}
body[data-lay="phone"] .propbar{position:fixed;left:8px;right:8px;bottom:calc(var(--tabh) + var(--sab) + 8px);z-index:42;margin:0;box-shadow:var(--shadow-2)}
.didnt{margin-top:8px}
.didnt summary,.fold > summary{cursor:pointer;font-size:13px;font-weight:650;color:var(--ink-2);min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
.didnt summary::-webkit-details-marker,.fold > summary::-webkit-details-marker{display:none}
.didnt summary::before,.fold > summary::before{content:"›";display:inline-block;font-size:16px;color:var(--muted);transition:transform .18s var(--ease)}
.didnt[open] summary::before,.fold[open] > summary::before{transform:rotate(90deg)}
body[data-lay="phone"] .didnt summary,body[data-lay="phone"] .fold > summary{min-height:44px}

/* ---------- Review ---------- */
.stat{font-size:15px;font-weight:650;color:var(--ink-2)} .stat b{font-size:22px;font-weight:760;color:var(--ink);margin-left:6px}
.lookdays{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
body[data-lay="phone"] .lookdays{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:3px}
body[data-lay="phone"] .card{padding:12px}
.lookdays button{min-width:0;height:48px;border-radius:10px;background:var(--paper);border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lookdays .d{font-size:12px;font-weight:700;color:var(--muted);line-height:14px} .lookdays .n{font-size:14px;font-weight:740;line-height:17px}
.lookdays button.has{border-color:var(--good)}
.lookdays button.sel{background:var(--ink);border-color:var(--ink)} .lookdays button.sel .d,.lookdays button.sel .n{color:var(--on-ink)}
.where{flex:0 0 auto;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;padding-right:8px;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.omrow{border:1px solid var(--hair);border-radius:12px;background:var(--paper);padding:8px 12px;margin-bottom:6px}
.omrow .l{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.omrow .b{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
body[data-lay="phone"] .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:8px 12px;min-width:0}
.tile .hk{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.tile .hv{display:block;font-size:18px;font-weight:740;margin-top:2px}
.tile .hs{display:block;font-size:12px;color:var(--muted)}
.gymrow{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:8px;font-size:14px;font-weight:600}
.htab{display:grid;grid-template-columns:56px repeat(4,1fr);gap:0 8px;margin-top:8px}
.htab > span{font-size:12px;padding:4px 0;border-bottom:1px solid var(--hair-2);text-align:right}
.htab > span:nth-child(5n+1){text-align:left;color:var(--muted)}
.htab .hh{font-weight:760;color:var(--muted)}

/* ---------- dialogs / sheets ---------- */
dialog{border:none;border-radius:20px;padding:0;background:var(--paper);color:var(--ink);box-shadow:var(--shadow-3);width:min(440px,calc(100vw - 24px));max-height:min(88dvh,820px);overflow:auto}
dialog::backdrop{background:var(--scrim)}
body[data-lay="phone"] dialog{margin:auto auto 0;width:100vw;max-width:100vw;border-radius:20px 20px 0 0;max-height:88dvh}
dialog.menu{width:min(320px,calc(100vw - 24px))}
.dlg{padding:20px}
.dlg h3{margin:0 0 4px;font-size:17px;font-weight:700;line-height:22px}
.dlg p{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.dlg label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.dlg input,.dlg textarea,.dlg select{width:100%;background:var(--paper-2);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px}
.dlg input:focus,.dlg textarea:focus,.dlg select:focus{outline:2px solid var(--focus);outline-offset:1px}
.dlg textarea{min-height:120px;resize:vertical;line-height:1.45}
.dlg textarea#f-label{min-height:56px;font-size:17px;font-weight:600;line-height:1.35}
.dlg .acts{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:-20px;background:var(--paper);padding:8px 0 4px}
.dlg .acts button{flex:1;min-height:46px;border-radius:12px;font-size:14px;font-weight:680;padding:0 12px}
.dlg .acts .cancel{background:var(--paper-2);border:1px solid var(--hair);color:var(--ink-2)}
.dlg .acts .save{background:var(--ink);color:var(--on-ink)}
.dlg .acts .clear{flex:0 0 auto;background:none;color:var(--late-ink);padding:0 8px}
.dlg .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlg .chiprow{display:flex;flex-wrap:wrap;gap:6px}
.dlg .chiprow.nowrap{flex-wrap:nowrap}
.dchip{font-size:13px;font-weight:650;padding:0 12px;min-height:36px;border-radius:10px;background:var(--paper-2);border:1px solid var(--hair);color:var(--ink-2)}
.dchip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
body[data-lay="phone"] .dchip{min-height:44px}
.dlg .chk{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.dlg .chk input{width:auto;min-height:0}
.dlg .timez{display:flex;gap:8px;align-items:center}
.dlg .labrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.dlg .labrow label{margin:0}
.dlg table th,.dlg table td{padding:3px 0;font-size:13px}
.where2{font-size:13px;color:var(--muted);font-weight:600;margin:6px 0 0}
.tiles3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile-b{min-width:0;min-height:56px;border-radius:12px;background:var(--paper-2);border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;font-size:14px;font-weight:700;color:var(--ink)}
.tile-b small{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tile-b:hover:not(:disabled){border-color:var(--edge);background:var(--raise)}
.tile-b.today{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.tile-b.pool{color:var(--gold-ink)}
.tile-b:disabled{opacity:.45;cursor:default}
.tile-b[aria-current="true"]{opacity:1;background:var(--paper);border-style:dashed;color:var(--muted)}
.tile-b.wide2{grid-column:span 2}
.menulist{display:flex;flex-direction:column;gap:2px;margin:4px -8px 0}
.menulist button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px;border-radius:10px;font-size:15px;font-weight:600;text-align:left;color:var(--ink)}
.menulist button:hover:not(:disabled){background:var(--paper-2)}
.menulist button:disabled{color:var(--muted);cursor:default}
.menulist .sub2{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.menulist hr{border:none;border-top:1px solid var(--hair);margin:4px 12px}
.sheetsubs{display:flex;flex-direction:column;gap:2px}
.sheetsubs .sub{min-height:36px;font-size:14px}
.ordrow{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- looks: token overrides only ---------- */

/* A row with a job chip: the words come first. If the whole label fits on one line beside the chip, bell, step count and
   Move, the row is one line as before. If it does not, those drop together to a second line under the label (at the
   right) and the label has the whole first line to itself, so the chip never costs a word and never breaks one. The
   chip is never hidden or cut. Rows without a job are untouched by these rules. */
.t.hasjob{flex-wrap:wrap;--labmax:calc(100% - 30px)}
.t.hasjob.hasgrip{--labmax:calc(100% - 42px)}

.t.hasjob:not(.done) .lab .lt{-webkit-line-clamp:3}
.t.hasjob .tail{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:0 4px;flex:0 0 auto;margin-left:auto;min-width:0;max-width:100%}
.t.hasjob .pill.job{max-width:none;overflow:visible}

<script type="module">
/* ============================================================
   Weekly Planner — reengineered prototype
   Vanilla single-file. In-memory + localStorage (separate key,
   never touches the live planner's file — see the 2.7 boundary below).
   ============================================================ */

/* 2.7: LIVE-PLANNER BOUNDARY ================================================
   The live v2.4 planner shares this origin's localStorage. This block is the ONLY
   place in the file that names its key prefix. (a) Every localStorage/sessionStorage
   write or remove of a live key throws, whoever calls it; clear() is refused outright.
   (b) readLiveStoreReadOnly() is the only code that reads the live store. */
const __LIVE_PREFIX = 'wp:';
(function(){
  try{
    const P=Storage.prototype, oSet=P.setItem, oRem=P.removeItem;
    const isLive=k=>{ k=String(k); return k.startsWith(__LIVE_PREFIX) || k.startsWith('p27:'); };   /* 2.8: the old planner's keys AND Planner 2.7's */
    P.setItem=function(k,v){ if(isLive(k)) throw new Error('2.8 guard: refusing to write a live-planner key'); return oSet.call(this,k,v); };
    P.removeItem=function(k){ if(isLive(k)) throw new Error('2.8 guard: refusing to remove a live-planner key'); return oRem.call(this,k); };
    P.clear=function(){ throw new Error('2.8 guard: clear() refused — it would wipe the live planner'); };
  }catch(e){}
})();
function readLiveStoreReadOnly(){ try{ return localStorage.getItem(__LIVE_PREFIX+'reeng:proto:v1'); }catch(e){ return null; } }
/* 2.7: end of boundary ===================================================== */
const STORE_KEY = 'p28:reeng:proto:v1';   // sandbox key — distinct from the live app's p28:concept:v2app
let UID = 1;
/* 2.7 (R10): new tasks and sub-tasks get random ids — k + base36(ms) + base36(4 random bytes) — so two
   devices restored from the same copy can never mint the same id. Old t<n> ids are untouched; UID/_uid
   and reseedUID() still run so a v2.4 build reading this store keeps working. */
function newId(){ const a=new Uint8Array(4); crypto.getRandomValues(a); return 'k'+Date.now().toString(36)+((((a[0]<<24)>>>0)+(a[1]<<16)+(a[2]<<8)+a[3]).toString(36).padStart(7,'0')); }
const uid = () => newId();
/* 2.7: small deterministic string hash (FNV-1a 32-bit, base36) for derived ids */
function fnv36(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(36); }

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const isoOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWFULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function mondayOf(dt){ const d=new Date(dt); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); d.setHours(0,0,0,0); return d; }
function isoMonday(dt){ const m=mondayOf(dt); return isoOf(m.getFullYear(),m.getMonth(),m.getDate()); }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoOf(dt.getFullYear(),dt.getMonth(),dt.getDate()); }
function esc(s){ return (s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tmin(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }

/* ---------- seed (real tasks, from your Excel via planner-seed.js) ---------- */
function T(label, kind, opts={}){ return { id:uid(), createdAt:Date.now(), label, kind, done:!!opts.done, time:opts.time||null, subs:(opts.subs||[]).map(s=>({id:uid(),label:s,done:false})), open:false, repeat:opts.repeat||null, defers:opts.defers||0, private:!!opts.private, projectId:opts.projectId||null, remind:opts.remind||null, claude:opts.claude||null, claudeLink:opts.claudeLink||null }; }
function day(y,m,d, personal, work){ const dt=new Date(y,m,d); return { personal, work, appts:[], dow:DOW[(dt.getDay()+6)%7], n:d, month:MON[m] }; }
function emptyWeekDays(iso){ const [y,m,d]=iso.split('-').map(Number); return Array.from({length:7},(_,i)=>{ const dt=new Date(y,m-1,d+i); return { personal:[],work:[],appts:[], dow:DOW[i], n:dt.getDate(), month:MON[dt.getMonth()] }; }); }

function buildSeed(){
  // Fresh start: the CURRENT week, empty, with the standing recurring rules applied.
  // No historical sample weeks — a brand-new device begins clean and adopts the cloud copy on connect.
  const recur = [
    { day:'Mon', lane:'work', label:'Plan for Week', subs:['Outstanding actions','Priorities'] },
    { day:'Fri', lane:'work', label:'Expenses', subs:[] },
    { day:'Fri', lane:'personal', label:'Pay Credit Card', subs:[] },
  ];
  const [sy,sm,sd]=todayMonday.split('-').map(Number);
  const wk={ key:todayMonday, monday:[sy,sm-1,sd], days:emptyWeekDays(todayMonday), future:{personal:[],work:[]}, weekend:{personal:[],work:[]} };
  recur.forEach(r=>{ const di=DOW.indexOf(r.day); if(di<0) return; if(addDays(todayMonday,di)<todayISO) return; wk.days[di][r.lane].push(T(r.label, r.lane, {subs:(r.subs||[]).slice(), repeat:'weekly'})); });
  const db = { weeks:{ [todayMonday]:wk }, recur, inbox:[], projects:[], shopping:[], health:{ source:'none', updatedAt:0, days:{} }, gym:{}, savedAt:Date.now(), v:3 };
  return db;
}
// installs the default projects + tags matching tasks — additive, safe to run on existing data

/* ---------- state + persistence ---------- */
let DB;
// scan every task + sub id and make sure the uid counter is past them — a stale _uid
// (the 1–2 Aug duplicate-id incident) can otherwise reissue ids that already exist
function reseedUID(db){
  let mx=0; const look=t=>{ const m=/^t(\d+)$/.exec(t.id||''); if(m) mx=Math.max(mx,+m[1]); (t.subs||[]).forEach(s=>{ const n=/^t(\d+)$/.exec(s.id||''); if(n) mx=Math.max(mx,+n[1]); }); };
  Object.values(db.weeks||{}).forEach(wk=>{ (wk.days||[]).forEach(d=>{ (d.personal||[]).forEach(look); (d.work||[]).forEach(look); }); ['future','weekend'].forEach(z=>{ if(wk&&wk[z]){ (wk[z].personal||[]).forEach(look); (wk[z].work||[]).forEach(look); } }); });
  (db.shopping||[]).forEach(look);
  UID=Math.max(UID, mx+1);
}
function loadDB(){
  let raw=null; try{ raw=localStorage.getItem(STORE_KEY); }catch(e){}
  if(raw){ try{ const o=JSON.parse(raw); if(!o||typeof o!=='object'||Array.isArray(o)||Array.isArray(o.weeks)) throw new Error('not a planner store'); UID=(o._uid||1000); migrate(o); reseedUID(o); _memBaseText=raw; return o; }
    catch(e){ _corrupt={ raw, at:Date.now(), why:String(e&&e.message||e) }; keepCorruptCopy(raw); } }   /* 2.7 fix F2 */
  return buildSeed();
}
/* 2.7 (3.6) MULTI-TAB. _memBaseText = the exact store text this tab last loaded or wrote. If the stored text
   differs at save time, another tab (or window) wrote in between: this tab's changes since its base are
   replayed onto the stored copy, task by task, instead of overwriting it. Other tabs are told after every
   write (BroadcastChannel + the storage event) and reload when they are not mid-edit. */
let _memBaseText=null;
const _bc = (typeof BroadcastChannel!=='undefined') ? new BroadcastChannel('p28-store') : null;
function skelWeek(iso){ const [y,m,d]=iso.split('-').map(Number); return { key:iso, monday:[y,m-1,d], days:emptyWeekDays(iso), future:{personal:[],work:[]}, weekend:{personal:[],work:[]} }; }
function taskIndex(db){ const m=new Map(); Object.entries(db.weeks||{}).forEach(([w,wk])=>{ if(!wk||!Array.isArray(wk.days)) return; ['personal','work'].forEach(k=>{ wk.days.forEach((d,i)=>((d&&d[k])||[]).forEach((t,j)=>t&&m.set(t.id,{w,di:i,k,j,t}))); [['future','F'],['weekend','W']].forEach(([z,zz])=>(((wk[z]||{})[k])||[]).forEach((t,j)=>t&&m.set(t.id,{w,di:zz,k,j,t}))); }); }); return m; }
/* replay L's changes (relative to base B) onto S. Pure: returns a new object, B/L/S untouched. */
function replayOnto(B, L, S){
  const R=JSON.parse(JSON.stringify(S)); R.weeks=R.weeks||{};
  const iB=taskIndex(B), iL=taskIndex(L), iR=taskIndex(R);
  const removeFromR=id=>{ const x=iR.get(id); if(!x) return; const wk=R.weeks[x.w]; const arr=colArr(wk,x.di,x.k); const p=arr.findIndex(t=>t&&t.id===id); if(p>=0) arr.splice(p,1); iR.delete(id); };
  const insertR=(x)=>{ if(!R.weeks[x.w]) R.weeks[x.w]=skelWeek(x.w); const arr=colArr(R.weeks[x.w],x.di,x.k); arr.splice(Math.min(x.j,arr.length),0,JSON.parse(JSON.stringify(x.t))); };

/* 2.7 (R4): rolling cloud backups. At most one per 2 h per device (stamp kept in localStorage, so
   reloads do not repeat it), each to a NEW name backups28/planner28-<date>-<hhmm>.json written with
   If-None-Match:* so an existing backup is never replaced; the newest 30 are kept. */
const BK_KEY='p28:od:lastbackup';
async function odWriteBackup(text, tag){
  const d=new Date(); const stem='backups28/planner28-'+computeTodayISO()+'-'+pad(d.getHours())+pad(d.getMinutes())+(tag?'-'+tag:'');
  for(let i=0;i<6;i++){ const name=stem+(i?'-'+i:'')+'.json'; const r=await odWrite(name, text, {ifNoneMatch:true}); if(!(r&&r.conflict)) return name; }
  throw new Error('backup name clash');

async function odMaybeBackup(force){
  let last=0; try{ last=+(localStorage.getItem(BK_KEY)||0); }catch(e){}
  if(!force && Date.now()-last < 2*3600e3) return null;
  const cur=await gText(APPROOT+'/'+OD.file+':/content');
  let name=null; if(cur!=null) name=await odWriteBackup(cur, force?'before-replace':'');
  try{ localStorage.setItem(BK_KEY, String(Date.now())); }catch(e){}

}
async function odPruneBackups(){
  const t=await getToken(OD, odState);

  if(!r.ok) return;

let calCache = {};

function apptsFor(iso){ const a=(calCache&&calCache[iso])||[]; return a.slice().sort((x,y)=>((y.allDay?1:0)-(x.allDay?1:0))||(''+(x.time||'')).localeCompare(''+(y.time||''))); }
function apptCard(ev){ return `<div class="appt"><span class="appt-t">${ev.allDay?'all day':esc(ev.time||'')}</span><span class="appt-l">${esc(ev.title)}${ev.loc?`<span class="appt-loc">${esc(ev.loc)}</span>`:''}</span></div>`; }

async function refreshCalendar27(){
  if(!calState.connected || !DEPLOY_OK) return;
  calState.syncing=true; updateSyncBadge();
  try{
    const start=addDays(todayISO,-14)+'T00:00:00', end=addDays(todayISO,63)+'T23:59:59';
    const t=await getToken(CAL, calState);
    const url=CAL.graph+'/me/calendarView?startDateTime='+start+'&endDateTime='+end+'&$select=subject,start,end,isAllDay,location&$orderby=start/dateTime&$top=250';
    const r=await fetch(url,{ headers:{ Authorization:'Bearer '+t, Prefer:'outlook.timezone="Europe/London"' } });
    const j=await r.json(); if(!r.ok) throw new Error('calendar '+r.status);
    const c={ __src:'outlook' };
    (j.value||[]).forEach(ev=>{ const s=ev.start&&ev.start.dateTime; if(!s) return; const iso=s.slice(0,10); (c[iso]=c[iso]||[]).push({ title:ev.subject||'(busy)', time:ev.isAllDay?'':s.slice(11,16), allDay:!!ev.isAllDay, loc:(ev.location&&ev.location.displayName)||'' }); });
    calCache=c; persistCalCache(); calState.lastSync=Date.now(); calState.error=null;
  }catch(e){ if(e&&e.needsSignIn){ /* the card's signed-out banner says this better; keep any specific reason already recorded */ } else { calState.error='Calendar: '+e.message; } }
  calState.syncing=false; updateSyncBadge();
}

/* v2.1 (FAULT 2, fix 4): a push/pull ring log surfaced in the app, so the NEXT incident is
   read here, not reconstructed from OneDrive version history. Shows time, direction, this
   device, revision, task count and DATED count (a revert-to-pool shows as dated dropping). */
function renderSyncLog(){
  const L=odLogRead(); if(!L.length) return '';
  const hhmmO=ts=>{ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
  const rows=L.slice(-12).reverse().map(e=>{
    const label = e.dir==='push-ok'?'▲ pushed' : e.dir==='pull-adopt'?'▼ adopted' : e.dir==='pull'?'▼ pulled'
      : e.dir==='push-conflict'?('⚠ changed elsewhere → '+(e.decision||'')) : e.dir;
    const nums = [ e.rev!=null?('r'+e.rev):'', e.tasks!=null?(e.tasks+'t'):'', e.dated!=null?(e.dated+' dated'):'',
                   (e.dir==='push-conflict'&&e.moved)?(e.moved+' moved'):'' ].filter(Boolean).join(' · ');
    return `<div class="t" style="cursor:default"><span class="lab">${hhmmO(e.t)} <span class="subdesc">${label}${nums?' · '+nums:''} · ${(e.dev||'').slice(0,5)}</span></span></div>`;
  }).join('');
  return `<div class="eyebrow">Saving log<button class="addmini" data-act="synclog-clear" title="clear the log">clear</button><span class="ln"></span></div>
    <div class="list">${rows}</div>
    <div class="conn-d" style="margin-top:4px">Last ${Math.min(12,L.length)} of ${L.length} events on this device. "dated" = tasks on a weekday; if it drops with no push from you, a stale device tried to revert.</div>`;
}

function findTask(el){
  const id=el.dataset.id||el.closest('[data-id]')?.dataset.id;
  const w=el.dataset.w||el.closest('[data-w]')?.dataset.w;
  const dRaw=el.dataset.d!==undefined?el.dataset.d:el.closest('[data-d]')?.dataset.d;
  if(id==null||w==null) return null;
  let wk=DB.weeks[w];
  if(!wk && _shimKey===w && /^\d{4}-\d{2}-\d{2}$/.test(w)) wk=ensureWeek(w);   /* 2.7: first real action in a browsed week */
  if(!wk) return null;
  const di = (dRaw==='F'||dRaw==='W')?dRaw:Number(dRaw);
  for(const kind of ['personal','work']){
    const arr=colArr(wk,di,kind); const idx=arr.findIndex(t=>t.id===id);
    if(idx>=0) return {wk,di,kind,arr,idx,t:arr[idx]};
  }
  return null;
}

/* ---------- Undo (V14): one last change, reachable from the toast (10 s or until the next action, whichever is
   later), from the ... menu ("Undo: <last change>") and with Ctrl+Z on the laptop. ---------- */
let _undo=null, _toastAt=0, _toastT=null;
function setUndo(label, fn){ _undo={ label:String(label||'last change'), fn }; }
function runUndo27(){ const u=_undo; hideUndoToast(); if(!u){ flashToast('Nothing to undo'); return false; } _undo=null; try{ u.fn(); }catch(e){ console.error(e); } return true; }
function hideUndoToast(){ const el=document.getElementById('undotoast'); if(el) el.style.display='none'; clearTimeout(_toastT); _toastAt=0; }
function flashToast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent=msg; el.style.display='block'; clearTimeout(flashToast._t); flashToast._t=setTimeout(()=>{ el.style.display='none'; }, 2600);
}
function flashUndo(msg, fn, opts){
  opts=opts||{}; setUndo(opts.label||msg, fn);
  let el=document.getElementById('undotoast');
  if(!el){ el=document.createElement('div'); el.id='undotoast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.innerHTML=`<span class="msg">${esc(msg)}</span><button type="button" data-undo>Undo</button>${opts.change?'<button type="button" class="sec2" data-change>Change</button>':''}`;
  el.style.display='flex'; const t=document.getElementById('toast'); if(t) t.style.display='none';
  el.querySelector('[data-undo]').onclick=()=>{ runUndo(); };
  const ch=el.querySelector('[data-change]'); if(ch) ch.onclick=()=>{ hideUndoToast(); try{ opts.change(); }catch(e){ console.error(e); } };
  _toastAt=Date.now(); clearTimeout(_toastT);
}
/* the toast leaves at his next action once 10 s have passed (never on a timer alone) */
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, e=>{ if(!_toastAt) return; if(e.target&&e.target.closest&&e.target.closest('#undotoast')) return; if(Date.now()-_toastAt>=10000) hideUndoToast(); }, true));
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey||e.metaKey) || e.shiftKey || (e.key!=='z'&&e.key!=='Z')) return;
  const el=e.target; if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA') && el.value) return;   // let the field undo its own typing
  if(dlg.open) return; e.preventDefault(); runUndo();
});

function restorePos27(s){ const c=findTaskById(s.id); if(!c) return false; const i=c.arr.indexOf(c.t); if(i>=0) c.arr.splice(i,1); const wk=ensureWeek(s.w); c.t.kind=s.kind; const arr=colArr(wk,s.di,s.kind); arr.splice(Math.max(0,Math.min(s.idx,arr.length)),0,c.t); c.t.defers=s.defers; const h=JSON.parse(s.hist); if(h) c.t.hist=h; else delete c.t.hist; return true; }

/* ---------- WEEK+ : one board. Every bucket is always in the page; which ones are open is the only difference
   between the short view (Unscheduled, today, the next day, Weekend) and Whole week. ---------- */
function openCount(w, di){ return colArr(w,di,'personal').filter(t=>!t.done).length+colArr(w,di,'work').filter(t=>!t.done).length; }
/* ---------- p12: the Weekend arrangement of Week+ (laptop and wide windows only) ----------
   Either day, Sat and Sun are each a full-height column of their own, side by side, sharing the width with Unscheduled.
   Mon to Fri are the folded strips Week+ already has. It is the default on Saturday and Sunday for this week; the Weekend
   button turns it on and off on any day and for any week. Display only: it reads the planner, and the one thing it keeps
   is this device's own choices for today, p28:ui:wkend = "DATE;WEEK:on;WEEK:off": a press counts for the week it was made
   on, for that day only. It never writes the planner and sends no save. Phone and tablet never come here (wkendOn is

function wkendChoices(){ const p=String(ui.wkend||'').slice(0,1200).split(';'), m={}; if(p[0]!==todayISO) return m;      // another day's choices count for nothing
  for(let i=1;i<p.length && i<=60;i++){ const x=/^(\d{4}-\d{2}-\d{2}):(on|off)$/.exec(p[i]); if(x) m[x[1]]=x[2]; } return m; }
function wkendOn(){ const vp=vpName(); if(vp!=='wide' && vp!=='laptop') return false;
  const c=wkendChoices()[ui.weekKey]; return c ? c==='on' : wkendAuto(); }
function wkendSet(on){ const m=wkendChoices(); delete m[ui.weekKey]; m[ui.weekKey]=on?'on':'off';                         // for the week on screen only
  ui.wkend=todayISO+Object.keys(m).slice(-60).map(k=>';'+k+':'+m[k]).join(''); lsSet('p28:ui:wkend', ui.wkend); }

function wkendBtn(vp){ return ((vp==='wide'||vp==='laptop') && ui.view==='weekplus') ? `<button class="hb" data-act="wkendview" aria-pressed="${wkendOn()}">Weekend</button>` : ''; }
/* how the open columns share the width. n = open columns without Next week, total = all columns, want2 = Either day asks for a

  if(want2 && unit(n+1, n+1)>=300 && unit(n+1, n+2)<300) want2=false;                         // R1: where Next week is a column with equal shares but would fold with the double share, keep equal shares
  const fit=unit(n+1, n+1+(want2?1:0))>=300, nxt=fit||hand, open=n+(nxt?1:0);

function wkendCols(){
  const wk=weekView(ui.weekKey), nxKey=addDays(ui.weekKey,7), nwk=weekView(nxKey);

  const dcol=i=>({id:'d'+i, cls:(isThis&&i===td)?'today':'', dw:DOW[i], nn:String(wk.days[i].n), secs:[dsec(i)], today:isThis&&i===td, count:(!isThis||i>=td)?openCount(wk,i):0, chip:i<5?i:undefined});

/* ---------- Add: one field, never a question. A day phrase counts only at the very end of a line (V8). ---------- */
const DAYWORDS={mon:0,monday:0,tue:1,tues:1,tuesday:1,wed:2,weds:2,wednesday:2,thu:3,thur:3,thurs:3,thursday:3,fri:4,friday:4,sat:5,saturday:5,sun:6,sunday:6};
const ADD_RE=/^(.*?\S)\s+(?:(?:on|by|for|at the|at|this)\s+)?(today|tomorrow|next week|in [1-8] weeks?|weekend|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:rsday|rs|r)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)$/i;
function addDefault(){
  const onScreen=(ui.view==='weekplus'||ui.view==='week')?(ui.weekKey||todayMonday):todayMonday;
  if(!isLap() && ui.view==='weekplus' && !ui.oldBoard){ if(ui.chip==='N') return {week:addDays(onScreen,7), di:'F'}; return {week:onScreen, di:ui.chip}; }
  return {week:onScreen, di:'F'};
}
function parseAddLine(line){
  const s=String(line||'').replace(/\s+/g,' ').trim(); if(!s) return null;
  const m=ADD_RE.exec(s); if(!m) return {label:s, at:null};
  const p=m[2].toLowerCase(); const onScreen=(ui.view==='weekplus'||ui.view==='week')?(ui.weekKey||todayMonday):todayMonday; let at=null;
  if(p==='weekend') at={week:onScreen, di:'W'};
  else if(p in DAYWORDS){ const di=DAYWORDS[p]; at=(onScreen!==todayMonday)?{week:onScreen, di}:parseWhen(DOW[di]); }
  else at=parseWhen(p);

}

  lines.forEach(L=>{ const at=L.at||def; const wk=ensureWeek(at.week); const t=T(L.label,lane); colArr(wk,at.di,lane).push(t); ids.push(t.id); if(!first) first=at; });
  saveDB(); render();

function computeFit27(iso, P, fit){

  const put=(t,pool)=>{ const e=estOf(t,fit); while(bi<blocks.length && blocks[bi].cap-blocks[bi].used<e) bi++; if(bi>=blocks.length) return false; blocks[bi].rows.push({t, pool, w:X.wkKey, d:pool?'F':X.di}); blocks[bi].used+=e; return true; };
  tasks.forEach(t=>{ if(!put(t,false)) over.push(t); });
  let free=0; for(let i=bi;i<blocks.length;i++) free+=blocks[i].cap-blocks[i].used;
  let pooled=0; if(fit && fit.pool){ for(const t of X.pool){ if(!put(t,true)) break; pooled++; } }
  return {blocks, over, free, pooled, poolOpen:X.pool.length, dayOpen:X.tasks.length, order:blocks.map(x=>({b:x.b.id, ids:x.rows.map(r=>r.t.id)}))};

function jobLike(c){ const t=String(c==null?'':c).replace(/\s+/g,''); return /^J[0-9A-Z]{4,7}$/i.test(t) && /\d/.test(t); }
function jobStart(line){ return /^\s*J\s*[\dI](\s*\d)/i.test(line) || jobLike(String(line).split('\t')[0]); }
function jobsFromRows(rows){
  const map=new Map(); let bad=0, dup=0, old=0; const dups=[], odd=[]; const yy=new Date().getFullYear()%100;
  (rows||[]).forEach(r=>{ const c0=String(r[0]==null?'':r[0]).trim(); if(!c0 && !String(r[1]==null?'':r[1]).trim()) return; if(isJobHeader(c0)) return;
    const no=normJobNo(c0); if(!no){ bad++; return; }
    const name=String(r[1]==null?'':r[1]).replace(/\s+/g,' ').trim().slice(0,120);
    if(!name){ bad++; return; }                                   // a number with no name is not a job
    if(+no.slice(1,3)<JOB_MIN_YEAR){ old++; return; }
    if(map.has(no)){ dup++; dups.push({no, kept:map.get(no).name, other:name}); return; }   // the first one is kept; both are shown to him
    map.set(no,{no,name}); if(+no.slice(1,3)>yy+1) odd.push(no); });

async function inflateRaw(u8){ const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return new Uint8Array(await new Response(s).arrayBuffer()); }

  for(let k=0;k<cnt;k++){ if(p+46>n || dv.getUint32(p,true)!==0x02014b50) throw new Error('The file could not be read.');

}

/* ---------- Photo background: this device only (IndexedDB "p28-ui"), never localStorage, never the task store ----------
   Two modes: 'soft' (behind everything, blurred, veiled with the look's background) and 'band' (top strip only).
   Readability is enforced: the veil is strengthened until every text colour that can sit on the bare page passes 4.5:1

/* ---------- PURE merge rule for DB.pa, for the merging engine (p7) to call: see tests/MERGE-NOTES-work.md ---------- */
function paMergeRule(B, L, R){
  B=B||{}; L=L||{}; R=R||{}; const rank={ undone:3, notneeded:2, answered:1, added:1 }; const same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
  const did={}; const dB=B.did||{}, dL=L.did||{}, dR=R.did||{};
  new Set([...Object.keys(dL), ...Object.keys(dR)]).forEach(k=>{ const a=dL[k], b=dR[k];
    if(a && b){ did[k]=((rank[a.as]||0)>(rank[b.as]||0))?a:b; }                // same key both sides: undone > notneeded > added
    else if(a){ if(!(dB[k] && same(dB[k],a))) did[k]=a; }                      // pruned on R and unchanged here: stays pruned
    else if(b){ if(!(dB[k] && same(dB[k],b))) did[k]=b; } });
  /* hand-backs by id: union; cancelled wins; one he took back with Undo on one device (in B, gone from one side, unchanged on the other) stays gone */
  const out=[]; const oB={}; (Array.isArray(B.out)?B.out:[]).forEach(o=>{ if(o&&o.id) oB[o.id]=o; }); const oL={}, oR={}; (Array.isArray(L.out)?L.out:[]).forEach(o=>{ if(o&&o.id&&!oL[o.id]) oL[o.id]=o; }); (Array.isArray(R.out)?R.out:[]).forEach(o=>{ if(o&&o.id&&!oR[o.id]) oR[o.id]=o; });
  [...Object.keys(oR), ...Object.keys(oL).filter(id=>!oR[id])].forEach(id=>{ const a=oL[id], b=oR[id];
    if(a && b) out.push((a.state==='cancelled' && b.state!=='cancelled')?a:b);
    else { const v=a||b; if(!(oB[id] && same(oB[id],v))) out.push(v); } });
  const qaB=B.qa||{}, qaL=L.qa||{}, qaR=R.qa||{}; const qa={}; const asked=[];

function bringTable(cols){ return `<table id="bring-counts" style="width:100%;border-collapse:collapse;font-size:14px;margin:8px 0"><tr><th style="text-align:left">&nbsp;</th>${cols.map(c=>`<th style="text-align:right">${c[0]}</th>`).join('')}</tr>${BRING_ROWS.map(([k,l])=>`<tr data-k="${k}"><td>${l}</td>${cols.map(c=>`<td style="text-align:right">${c[1][k]}</td>`).join('')}</tr>`).join('')}</table>`; }
function bringWhere(s){ return s.from==='cloud'?'OneDrive':('this '+devWord()); }
async function openBring27(){
  const closeBtn=`<div class="acts"><button class="cancel" data-x="c" style="min-height:44px">Close</button></div>`;
  const wireClose=()=>{ const b=dlg.querySelector('[data-x=c]'); if(b) b.addEventListener('click',closeDialog); };
  openDialog(`<h3>Bring my tasks from Planner 2.7</h3><p id="bring-from">Looking for Planner 2.7… Nothing there is changed.</p>${closeBtn}`); wireClose(); const gen=_dlgGen;
  const S=await bringSources(); if(gen!==_dlgGen || !dlg.open) return;                    // he closed it meanwhile
  if(!S.length){ openDialog(`<h3>Bring my tasks from Planner 2.7</h3><p id="bring-from">No Planner 2.7 tasks were found ${odState.connected?'in this browser or in OneDrive':'in this browser'}.${S.cloudFailed?' OneDrive could not be read just now.':''}${odState.connected?'':' If they are on another device, connect OneDrive in More first, then try again.'}</p>${closeBtn}`); wireClose(); return; }
  const src=S[0], other=S[1]||null; const P=await buildImport(src.text,'p27','Planner 2.7'); if(!dlg.open) return;
  if(P.error || (P.fails&&P.fails.length)){ openDialog(`<h3>Bring my tasks from Planner 2.7</h3><p id="bring-from"><b>Stopped. Nothing has changed.</b></p><p>${esc(P.error||P.fails.join(' · '))}</p>${closeBtn}`); wireClose(); return; }
  const there=bringCounts(P.result), here=bringHere(), keep=here.stored && here.tasks>0;
  openDialog(`<h3>Bring my tasks from Planner 2.7</h3>
    <p id="bring-from">Taking them from <b>${bringWhere(src)}</b>, saved ${esc(fmtWhen(src.savedAt))}. Planner 2.7 is only read. Nothing there changes.</p>
    ${other?`<p class="note" id="bring-other">The copy ${other.from==='cloud'?'in OneDrive':'on this '+devWord()} is older (saved ${esc(fmtWhen(other.savedAt))}), so it is not used.</p>`:''}
    ${bringTable([['Planner 2.7',there]])}
    ${keep?`<p id="bring-keep">What is here now (${here.tasks} task${here.tasks!==1?'s':''}) goes to Earlier copies first.</p>`:''}
    <div class="acts"><button class="cancel" data-x="c" style="min-height:44px">Cancel</button><button class="save" data-x="go" style="min-height:44px">${keep?'Replace what is here':'Bring them across'}</button></div>`);
  wireClose();
  dlg.querySelector('[data-x=go]').addEventListener('click',()=>{
    if(keep) saveEarlierCopy('Before bringing tasks from Planner 2.7', JSON.stringify(Object.assign({},DB,{_uid:UID})));
    applyImport(P, async res=>{ let came=[]; try{ came=await bringDeviceChoices(); }catch(e){} _bringSeen=null; render();
      const now=bringCounts(res.reread||DB); const same=BRING_ROWS.every(([k])=>now[k]===there[k]); const bad=(res.fails&&res.fails.length)||!same;
      openDialog(`<h3>${bad?'Brought across, but the check found a difference':'Brought across'}</h3>
        <p id="bring-done">Planner 2.7 was not changed.${came.length?' Your '+came.join(' and ')+' came too.':''}</p>
        ${bringTable([['Planner 2.7',there],['Here now',now]])}
        ${bad?`<div class="conn-warn">${(res.fails||[]).map(esc).join('<br>')}${same?'':'<br>The numbers above do not match.'}<br>Press Undo to go back.</div>`:''}
        ${odState.connected?'':`<p class="note" id="bring-connect">To save to OneDrive from Planner 2.8, press Connect in More. Sign-ins are not brought across.</p>`}
        <div class="acts"><button class="cancel" data-x="undo" style="min-height:44px">Undo</button><button class="save" data-x="ok" style="min-height:44px">OK</button></div>`);
      dlg.querySelector('[data-x=ok]').addEventListener('click',closeDialog);
      dlg.querySelector('[data-x=undo]').addEventListener('click',()=>{ closeDialog(); undoImport(); _bringSeen=null; render(); }); }); });
}
/* choices kept on the device only: the look, the lane last used, the photo. Only where 2.8 has none of its own. Sign-ins are never read. */
async function bringDeviceChoices(){ const came=[];
  try{ const lk=localStorage.getItem('p27:ui:look'); if(lk && LOOK_THEME[lk] && localStorage.getItem('p28:ui:look')===null){ localStorage.setItem('p28:ui:look', lk); applyLook(); came.push('look'); } }catch(e){}
  try{ const ln=localStorage.getItem('p27:ui:lane'); if((ln==='work'||ln==='personal') && localStorage.getItem('p28:ui:lane')===null){ localStorage.setItem('p28:ui:lane', ln); ui.kind=ln; } }catch(e){}
  try{ if(!_photo && indexedDB.databases){ const dbs=await indexedDB.databases();            // never open a database that is not there: opening would create it
      if(dbs.some(d=>d.name==='p27-ui')){ const rec=await new Promise(res=>{ let r; try{ r=indexedDB.open('p27-ui'); }catch(e){ return res(null); }
          r.onupgradeneeded=()=>{ try{ r.transaction.abort(); }catch(e){} }; r.onerror=()=>res(null); r.onblocked=()=>res(null);
          r.onsuccess=()=>{ const db=r.result; try{ if(!db.objectStoreNames.contains('kv')){ db.close(); return res(null); } const q=db.transaction('kv','readonly').objectStore('kv').get('photo'); q.onsuccess=()=>{ const v=q.result; db.close(); res(v||null); }; q.onerror=()=>{ db.close(); res(null); }; }catch(e){ try{ db.close(); }catch(_){} res(null); } }; });
        if(rec && rec.buf && rec.stats){ _photo=rec; if(_photoURL){ try{ URL.revokeObjectURL(_photoURL); }catch(e){} _photoURL=null; } photoApply(); await photoStore(); came.push('photo'); } } } }catch(e){}
  return came; }

/* ---------- "A newer version is ready" ----------
   Each build carries its own mark (the <meta name="p28-build"> near the top of the page). On opening, and when the page comes
   back into view (at most every five minutes), the first few thousand bytes of the page on the server are read and the mark
   compared. Nothing is fetched on a timer and nothing here ever touches a stored task. */
const P28_BUILD='d3ac1a3a';
let _newBuild=null, _updAt=0, _updBusy=false, _updNote='', _updAnyway=false, _lastKeyAt=0, _updT=null;
['keydown','input','compositionstart'].forEach(ev=>document.addEventListener(ev, ()=>{ _lastKeyAt=Date.now(); }, true));
function buildMarkIn(text){ const m=String(text||'').slice(0,8000).match(/<meta name="p28-build" content="([^"]+)"/); return m?m[1]:null; }
async function updCheck(why){ if(_newBuild || _updBusy) return; try{ if(!navigator.onLine) return; }catch(e){} if(why!=='open' && Date.now()-_updAt<5*60*1000) return; _updAt=Date.now();
  try{ const r=await fetch('./index.html?p28check=1', { cache:'no-store', headers:{ Range:'bytes=0-4095' } }); if(!r.ok) return; const mark=buildMarkIn(await r.text()); if(mark && mark!==P28_BUILD){ _newBuild=mark; updWhenQuiet(); } }catch(e){} }
/* quiet = no sheet open, nothing being dragged, no key pressed in the last five seconds */
function updQuiet(){ try{ if(dlg && dlg.open) return false; if(dragging) return false; }catch(e){} return Date.now()-_lastKeyAt>=5000; }
function updWhenQuiet(){ clearTimeout(_updT); if(!_newBuild || document.getElementById('updline')) return; if(updQuiet()) updRender(); else _updT=setTimeout(updWhenQuiet, 1000); }
function updUnsent(){ try{ return !!(odState.connected && odState.live && (_pushPending || odState.syncing || (Number.isInteger(DB.rev) && Number.isInteger(odState.baseRev) && DB.rev!==odState.baseRev))); }catch(e){ return false; } }
function updRender(){ let el=document.getElementById('updline'); if(!el){ el=document.createElement('div'); el.id='updline'; el.setAttribute('role','status'); document.body.insertBefore(el, document.body.firstChild); document.body.classList.add('hasupd'); }
  el.innerHTML=`<span class="msg">${esc(_updNote||'A newer version is ready')}</span><button type="button" id="updgo"${_updBusy?' disabled':''}>${_updBusy?'Reloading…':(_updAnyway?'Reload anyway':'Reload')}</button>`;
  el.querySelector('#updgo').addEventListener('click', updGo); try{ document.documentElement.style.setProperty('--updh', el.offsetHeight+'px'); }catch(e){} }
async function updGo(){ if(_updBusy) return; _updBusy=true; updRender();
  /* 1. anything not yet sent to OneDrive is sent first; if it cannot be, say so and let him decide (it is saved on the device either way) */
  if(!_updAnyway && updUnsent()){ try{ _pushPending=true; clearTimeout(_syncT); odPush(); }catch(e){} const t0=Date.now(); while(updUnsent() && Date.now()-t0<6000) await new Promise(r=>setTimeout(r,250));
    if(updUnsent()){ _updBusy=false; _updAnyway=true; _updNote='Your last changes are safe on this '+devWord()+' but have not reached OneDrive yet.'; updRender(); return; } }
  /* 2. fetch the new page now, check it really is the newer one, put it in the kept copy, then reload onto it */
  try{ const r=await fetch('./index.html?p28check=1', { cache:'reload' }); const t=r.ok?await r.text():''; const mark=buildMarkIn(t); if(!r.ok || !mark || mark===P28_BUILD) throw new Error('not there yet');     // the same address that showed the newer mark
    try{ if('caches' in window){ const c=await caches.open(P28_CACHE); const h={ 'content-type':'text/html; charset=utf-8' }; const lm=r.headers.get('last-modified'); if(lm) h['last-modified']=lm; const mk=()=>new Response(t, { headers:h });
        await c.put('./index.html', mk()); await c.put('./', mk()); await c.put('./__kept-once', new Response('1')); } }catch(e){}       // the worker hands over exactly this copy on the reload that follows
  }catch(e){ _updBusy=false; _updNote='Can’t reach the new version just now. Try again when you are online.'; updRender(); return; }

function versionLine(){ return 'Planner 2.8 · version '+P28_BUILD; }
try{ v28AfterView(); }catch(e){}      // the first screen was drawn before this part of the page was ready
setTimeout(()=>{ updCheck('open'); }, 2500);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) updCheck('view'); });
window.addEventListener('online', ()=>{ updCheck('view'); });
Object.assign(window.__p28, { openBring27, bringCounts, bringSources, bringOfferOn, updCheck, updState:()=>({ build:P28_BUILD, newBuild:_newBuild, shown:!!document.getElementById('updline'), unsent:updUnsent() }) });

// Register the service worker (offline-first). Harmless if unsupported.
/* 2.7 (review item 7): the live planner's service worker deletes every cache not named planner-v1 when it
