function ghErr(cls, msg, rel){ const e=new Error(msg); e.cls=cls; e.call=rel; return e; }
async function ghFetch(rel, body){
  const t=ghToken(); if(!t) throw ghErr('auth','gh-token',rel);
  let r;
  try{
    r=await fetch((GH.proxy||GH.api)+rel, body
      ? {method:'POST', headers:{Authorization:'Bearer '+t.access, 'Content-Type':'application/json'}, body:JSON.stringify(body)}
      : {headers:{Authorization:'Bearer '+t.access}});
  }catch(err){ throw ghErr('transient','network',rel); }
  if(r.status===401){ try{ localStorage.removeItem(GH.tokKey); }catch(e){} throw ghErr('auth','401',rel); }
  if(r.status===403){
    let j=null; try{ j=await r.json(); }catch(e){}
    const blob=JSON.stringify((j&&j.error)||{});
    if(/ACCESS_TOKEN_SCOPE_INSUFFICIENT|insufficient/i.test(blob)){
      const e=ghErr('permission','403-scope',rel);
      e.msg='Google didn’t allow the '+ghRelName(rel)+' permission, so data can’t load. Tap Fix permissions and tick every box.'; throw e;
    }
    if(/quota|rate/i.test(blob)) throw ghErr('transient','403-quota',rel);
    const reason=(j&&j.error&&(j.error.status||j.error.message))||'';
    const e=ghErr('permission','403',rel);
    e.msg='Google refused access (403'+(reason?': '+String(reason).slice(0,80):'')+'). Check you’re signed in as tomhunter848@gmail.com — if it persists it’s a Google-side setting, not this planner.'; throw e;
  }
  if(r.status===429) throw ghErr('transient','429',rel);
  if(!r.ok) throw ghErr(r.status>=500?'transient':'drift', String(r.status), rel);
  let j; try{ j=await r.json(); }catch(err){ throw ghErr('drift','bad-json',rel); }

}
/* ---- parsers. The line: tolerate ABSENCE (null — a fact about the world) and ADDITIONS

   wrongness is how data goes silently bad. ---- */
function ghCivil(iso){ const p=iso.split('-').map(Number); return { date:{ year:p[0], month:p[1], day:p[2] } }; }
function ghCivilDay(c, rel){
  if(!c) return null;
  if(typeof c==='string'){ const m=c.match(/^(\d{4})-(\d{2})-(\d{2})/); return m? m[1]+'-'+m[2]+'-'+m[3] : null; }
  const d=c.date||c;
  if(d && Number.isInteger(d.year) && Number.isInteger(d.month) && Number.isInteger(d.day))
    return d.year+'-'+String(d.month).padStart(2,'0')+'-'+String(d.day).padStart(2,'0');
  return null;
}
function ghNum(v, rel){ if(v==null) return null; const n=Number(v); if(!Number.isFinite(n)||n<0) throw ghErr('drift','bad-value',rel); return n; }
function ghFirst(v, keys, rel){ for(const k of keys){ if(v && v[k]!=null) return ghNum(v[k],rel); } return null; }
/* strict variant (adversarial review): the union OBJECT is present but carries none of the

   Google" silently clear stored older days. Loud beats silent: abort the group as drift. */
function ghFirstReq(v, keys, rel){ const n=ghFirst(v,keys,rel); if(n==null && v && typeof v==='object' && !keys.some(k=>k in v)) throw ghErr('drift','shape-renamed',rel); return n; }

  const arr = j.rollupDataPoints==null ? [] : j.rollupDataPoints;

  for(const p of arr){

}
function ghSleepEndDay(iv, rel){
  if(!iv) return null;
  const civ=ghCivilDay(iv.civilEndTime, rel); if(civ) return civ;
  const raw=iv.endTime; if(!raw) return null;
  if(/[zZ]$|[+-]\d\d:\d\d$/.test(raw)){                                  // zoned instant: shift to civil

    const off=parseFloat(iv.endUtcOffset||'0')||0;                         // Duration "3600s"

/* ---- group 1: the strip (steps, calories, active minutes, AZM, sleep) — all-or-nothing ---- */
async function ghFetchStrip(startIso, endExIso){
  const range={ range:{ start:ghCivil(startIso), end:ghCivil(endExIso) }, windowSizeDays:1 };
  const steps=ghRollupDays(await ghFetch('steps/dataPoints:dailyRollUp',range),'steps',
    p=>{ const v=ghUnion(p,'steps'); if(v==null) return null; return (typeof v==='object')?ghFirstReq(v,['countSum','count'],'steps'):ghNum(v,'steps'); });   /* probe 17 Aug: live field is countSum (int64 string) */
  const cals=ghRollupDays(await ghFetch('total-calories/dataPoints:dailyRollUp',range),'total-calories',
    p=>{ const v=ghUnion(p,'totalCalories'); if(v==null) return null;
         if(typeof v!=='object') return ghNum(v,'total-calories');
         const n=ghFirst(v,['kcalSum','kcal'],'total-calories'); if(n!=null) return n;
         if(v.energy) return ghFirstReq(v.energy,['kcal','kilocalories'],'total-calories');
         return ghFirstReq(v,['kcalSum','kcal'],'total-calories'); });
  const acts=ghRollupDays(await ghFetch('active-minutes/dataPoints:dailyRollUp',range),'active-minutes',
    p=>{ const v=ghUnion(p,'activeMinutes'); if(v==null) return null;
         const arr=v.activeMinutesRollupByActivityLevel;
         if(Array.isArray(arr)){ let m=0, got=false;
           for(const x of arr){ if(/MODERATE|VIGOROUS|FAIRLY|VERY/i.test(String(x&&x.activityLevel||''))){ m+=ghNum(x.activeMinutesSum,'active-minutes')||0; got=true; } }
           return got?m:null; }
         return ghFirstReq(v,['sum','minutes','activeMinutesRollupByActivityLevel'],'active-minutes'); });
  const azms=ghRollupDays(await ghFetch('active-zone-minutes/dataPoints:dailyRollUp',range),'active-zone-minutes',
    p=>{ const v=ghUnion(p,'activeZoneMinutes'); if(v==null) return null;
         const f=ghFirst(v,['sumInFatBurnHeartZone'],'active-zone-minutes'),
               c=ghFirst(v,['sumInCardioHeartZone'],'active-zone-minutes'),
               k=ghFirst(v,['sumInPeakHeartZone'],'active-zone-minutes');
         if(f==null&&c==null&&k==null){
           if(typeof v==='object' && !('sumInFatBurnHeartZone' in v) && !('sumInCardioHeartZone' in v) && !('sumInPeakHeartZone' in v)) throw ghErr('drift','shape-renamed','active-zone-minutes');
           return null;

    const f='sleep.interval.civil_end_time >= "'+startIso+'" AND sleep.interval.civil_end_time < "'+endExIso+'"';
    const rel='sleep/dataPoints?pageSize=25&filter='+encodeURIComponent(f)+(pageToken?'&pageToken='+encodeURIComponent(pageToken):'');

  }while(pageToken);

    const stp=steps[iso]!=null?steps[iso]:null, cal=cals[iso]!=null?cals[iso]:null,
          act=acts[iso]!=null?acts[iso]:null, az=azms[iso]!=null?azms[iso]:null;
    const sl=sleepAcc[iso]||null;

    /* measured-day gate: calories alone never proves the tracker was worn (§C6) */

                sleepMins:slp, azm:az,

/* ---- group 2: the dailies (RHR, HRV, breathing, SpO2, VO2max) — all-or-nothing ---- */
async function ghFetchDailies(startIso, endIso){

  const spec=[
    /* ghFirstReq here too (panel, connector QA): a dailies union always carries `date`, so a
       point whose VALUE key is missing is a rename/shape change — loud drift, never a silent
       null that clears stored older days. */

    ['daily-heart-rate-variability','daily_heart_rate_variability','dailyHeartRateVariability','hrvMs', (v,rel)=>ghFirstReq(v,['averageHeartRateVariabilityMilliseconds'],rel)],
    ['daily-respiratory-rate','daily_respiratory_rate','dailyRespiratoryRate','brpm', (v,rel)=>ghFirstReq(v,['breathsPerMinute','averageBreathsPerMinute','respiratoryRate'],rel)],
    ['daily-oxygen-saturation','daily_oxygen_saturation','dailyOxygenSaturation','spo2', (v,rel)=>ghFirstReq(v,['averagePercentage','percentage','averageOxygenSaturationPercentage'],rel)],
    ['daily-vo2-max','daily_vo2_max','dailyVo2Max','vo2max', (v,rel)=>ghFirstReq(v,['vo2Max','value','vo2MaxMlPerKgPerMin'],rel)],
  ];

    if(j.nextPageToken) throw ghErr('drift','pages',dt);   /* adversarial review: 14 days can't fill a 100-point page — an unfollowable token must be loud, never a silent truncation that nulls stored days */

function ghErrMsg(e){
  if(!e) return null;
  const name=e.call?ghRelName(e.call):'';
  if(e.cls==='auth') return 'Google Health signed out — tap to resume';
  if(e.cls==='permission') return e.msg||'Google refused access — see the Connections card';
  if(e.cls==='drift') return 'Google Health sent data this planner doesn’t recognise ('+(name||'?')+' · '+e.message+') — nothing changed. Needs a planner update.';
  return 'Couldn’t reach Google Health ('+(name?name+' · ':'')+e.message+') — last known figures shown';
}
/* ---- the refresh. Mirrors refreshHealth's discipline exactly; two atomic groups. ---- */

    let strip=null, dailies=null, stripE=null, dailiesE=null;

    if((stripE&&stripE.cls==='auth')||(dailiesE&&dailiesE.cls==='auth')) ghState.needsTap=true;
    const permE=(stripE&&stripE.cls==='permission'&&stripE)||(dailiesE&&dailiesE.cls==='permission'&&dailiesE)||null;
    ghState.permission=permE?(permE.msg||ghErrMsg(permE)):null;

async function refreshHealth(force){
  if(!fitToken()) return;
  if(fitState.refreshing) return;
  if(!force && Date.now()-_fitLast<30*60*1000) return;                    // at most twice an hour
  fitState.refreshing=true;
  try{
    /* v2.3 (adversarial review): DB.health now carries the gh sibling — the v2.2 wholesale
       replacement here would silently DELETE it on a GH-first device. Carry it across. */
    if(!DB.health || DB.health.source!=='fitbit'){ const _gh=DB.health&&DB.health.gh; DB.health={ source:'fitbit', updatedAt:Date.now(), days:{} }; if(_gh) DB.health.gh=_gh; }
    const start=addDays(todayISO,-6), end=todayISO;
    let changed=false, fetched=null;
    try{
      fetched=await fitFetchRange(start,end);
      fitState.error=null;                                                 // only a complete clean run clears it
    }catch(e){
      /* Any failure at all — 401, 429, 5xx, dropped connection, unexpected body — is
         reported. Silence here is what hid the original bug for a whole day. */
      if(!fitState.error) fitState.error = /^401$/.test(e.message)
        ? 'Fitbit session expired — reconnect'
        : 'Fitbit refresh failed ('+e.message+') — last known figures shown';
    }
    if(fetched){
      for(const iso of Object.keys(fetched)){
        const prev=DB.health.days[iso], next=fetched[iso];
        /* Last night and the night before may simply not have reached Fitbit yet, and a
           null there would delete a real figure that can never come back. Older days are
           left alone: the fetch is all-or-nothing, so for them a null is real information
           — a deleted or corrected Fitbit log must be able to clear what we hold. */
        const notYetSynced = iso>=addDays(todayISO,-1);
        if(prev && notYetSynced){ for(const k of ['sleepMins','steps','caloriesOut','activeMins']){ if(next[k]==null && prev[k]!=null) next[k]=prev[k]; } }
        if(!prev || JSON.stringify(prev)!==JSON.stringify(next)){ DB.health.days[iso]=next; changed=true; }
      }
      DB.health.updatedAt=Date.now();
    }
    _fitLast=Date.now();
    /* v2.1 (FAULT 2): this is an UNATTENDED write. It must NEVER bump savedAt or push —
       that is exactly what let a stale device overwrite the cloud on 9-10 Aug. Health is
       persisted locally only; it reaches the cloud on the next real (user-action) save, and
       each device fetches its own Fitbit data anyway. */
    if(changed) saveLocalOnly();
    renderDeferred();   /* v2.3: a background refresh must never rebuild the DOM mid-drag or mid-dialog */
  }catch(e){ /* never throw into the app */ }
  fitState.refreshing=false;
}

/* ---------- Undo (V14): one last change, reachable from the toast (10 s or until the next action, whichever is
   later), from the ... menu ("Undo: <last change>") and with Ctrl+Z on the laptop. ---------- */
let _undo=null, _toastAt=0, _toastT=null;
function setUndo(label, fn){ _undo={ label:String(label||'last change'), fn }; }
function runUndo(){ const u=_undo; hideUndoToast(); if(!u){ flashToast('Nothing to undo'); return false; } _undo=null; try{ u.fn(); }catch(e){ console.error(e); } return true; }
function hideUndoToast(){ const el=document.getElementById('undotoast'); if(el) el.style.display='none'; clearTimeout(_toastT); _toastAt=0; }
function flashToast(msg){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent=msg; el.style.display='block'; clearTimeout(flashToast._t); flashToast._t=setTimeout(()=>{ el.style.display='none'; }, 2600);
}
function flashUndo(msg, fn, opts){
  opts=opts||{}; setUndo(opts.label||msg, fn);
  let el=document.getElementById('undotoast');
  if(!el){ el=document.createElement('div'); el.id='undotoast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.innerHTML=`<span class="msg">${esc(msg)}</span><button type="button" data-undo>Undo</button>${opts.change?'<button type="button" class="sec2" data-change>Change</button>':''}`;
  el.style.display='flex'; const t=document.getElementById('toast'); if(t) t.style.display='none';
  el.querySelector('[data-undo]').onclick=()=>{ runUndo(); };
  const ch=el.querySelector('[data-change]'); if(ch) ch.onclick=()=>{ hideUndoToast(); try{ opts.change(); }catch(e){ console.error(e); } };
  _toastAt=Date.now(); clearTimeout(_toastT);
}
/* the toast leaves at his next action once 10 s have passed (never on a timer alone) */
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, e=>{ if(!_toastAt) return; if(e.target&&e.target.closest&&e.target.closest('#undotoast')) return; if(Date.now()-_toastAt>=10000) hideUndoToast(); }, true));

  if(!(e.ctrlKey||e.metaKey) || e.shiftKey || (e.key!=='z'&&e.key!=='Z')) return;
  const el=e.target; if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA') && el.value) return;   // let the field undo its own typing

function snapPos(id){ const c=findTaskById(id); if(!c) return null; return { id, w:c.wk.key, di:c.di, kind:c.t.kind, idx:c.arr.indexOf(c.t), defers:c.t.defers||0, hist:JSON.stringify(c.t.hist||null) }; }
function restorePos(s){ const c=findTaskById(s.id); if(!c) return false; const i=c.arr.indexOf(c.t); if(i>=0) c.arr.splice(i,1); const wk=ensureWeek(s.w); c.t.kind=s.kind; const arr=colArr(wk,s.di,s.kind); arr.splice(Math.max(0,Math.min(s.idx,arr.length)),0,c.t); c.t.defers=s.defers; const h=JSON.parse(s.hist); if(h) c.t.hist=h; else delete c.t.hist; return true; }
function restoreAll(snaps){ snaps.slice().sort((a,b)=>a.idx-b.idx).forEach(restorePos); saveDB(); render(); }
function ctxOf(id){ const c=findTaskById(id); if(!c) return null; c.kind=c.t.kind; c.idx=c.arr.indexOf(c.t); return c; }

/* ---------- task row (shared by every view) ---------- */
const CHK='<i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4 10-11"/></svg></i>';
function taskRow(t, ctx, opts={}){
  const sc=t.subs.length, sd=t.subs.filter(s=>s.done).length;
  const sel=`data-w="${ctx.w}" data-d="${ctx.d}" data-k="${t.kind}" data-id="${attr(t.id)}"`;
  const short=t.label.length>60?t.label.slice(0,57)+'…':t.label;
  const subsPill=sc?`<button class="pill subs ${sd===sc?'alldone':''}" data-act="toggle" aria-expanded="${!!t.open}" aria-label="Steps: ${sd} done, ${sc} in all. Show or hide">${sd}/${sc}</button>`:'';
  const bell=(t.remind&&!t.done)?`<svg class="rbell" viewBox="0 0 24 24" role="img" aria-label="Reminder ${attr(fmtRemind(t.remind))}">${IC.bell}</svg>`:'';
  const tag=opts.tag?`<span class="pill tag">${esc(opts.tag)}</span>`:'';
  const job=(t.job&&t.job.no)?`<span class="pill job" title="${attr(t.job.no+' · '+(t.job.name||''))}">${esc(t.job.no)}</span>`:'';
  const grip=opts.grip?`<span class="grip" data-act="grip" aria-hidden="true">⠿</span>`:'';
  const mv=opts.nomove?'':`<button class="mvbtn" data-act="movesheet" title="Move to…" aria-label="Move task: ${attr(short)}">${IC.move}</button>`;
  let html=`<div class="t ${t.kind==='work'?'kwork':''} ${t.done?'done':''} ${ui.selMode&&ui.sel.has(t.id)?'seled':''} ${opts.cls||''}${job?' hasjob'+(opts.grip?' hasgrip':''):''}" ${sel}>${grip}<button class="check" data-act="check" aria-pressed="${!!t.done}" aria-label="${t.done?'Done, tick to undo':'Complete'}: ${attr(short)}">${CHK}</button><span class="lab" data-act="edit" role="button" tabindex="0"${t.label.length>40?` title="${attr(t.label)}"`:''}><span class="lt"${(opts.num&&!t.done)?` data-num="${opts.num}"`:''}>${esc(t.label)}</span></span>${job?`<span class="tail">${tag}${job}${bell}${subsPill}${mv}</span>`:`${tag}${bell}${subsPill}${mv}`}</div>`;
  if(t.open && sc && !opts.nosubs){
    html+=`<div class="subs" ${sel}>${t.subs.map((s,j)=>`<div class="sub ${s.done?'done':''}" data-sub="${j}" data-sid="${attr(s.id)}"><button class="subcheck" data-act="subcheck" aria-pressed="${!!s.done}" aria-label="Step: ${attr(s.label)}">${CHK}</button><span class="lab"${j<26?` data-ltr="${String.fromCharCode(65+j)}"`:''}>${esc(s.label)}</span><button class="x" data-act="delsub" aria-label="Remove step: ${attr(s.label)}">×</button></div>`).join('')}<button class="sub add" data-act="addsub">+ Add a step</button></div>`;
  }
  return html;
}
function listHTML(arr, ctx, opts){ opts=opts||{}; let n=0; return `<div class="list" data-w="${ctx.w}" data-d="${ctx.d}" data-k="${ctx.k}">${arr.map(t=>taskRow(t,{w:ctx.w,d:ctx.d},opts.num?Object.assign({},opts,{num:t.done?0:++n}):opts)).join('')}</div>`; }
/* sub-task actions by id, so a double-click can never hit two different steps */
let _subGuard=0;
function subToggle(ctx, a){ const sid=a.closest('[data-sid]')?.dataset.sid; const c=ctxOf(ctx.t.id); if(!c) return; const s=c.t.subs.find(x=>String(x.id)===sid); if(!s) return; s.done=!s.done; s.doneAt=s.done?Date.now():null; s.doneOn=s.done?computeTodayISO():null; saveDB(); rerenderInPlace(); }
function subDelete(ctx, a){ if(Date.now()-_subGuard<450) return; _subGuard=Date.now(); const sid=a.closest('[data-sid]')?.dataset.sid; const c=ctxOf(ctx.t.id); if(!c) return; const j=c.t.subs.findIndex(x=>String(x.id)===sid); if(j<0) return; const gone=c.t.subs.splice(j,1)[0]; const tid=c.t.id; saveDB(); rerenderInPlace();
  flashUndo('Step removed', ()=>{ const c2=findTaskById(tid); if(c2 && !c2.t.subs.some(x=>x.id===gone.id)){ c2.t.subs.splice(Math.min(j,c2.t.subs.length),0,gone); saveDB(); rerenderInPlace(); } }); }
function toggleDone(ctx, el){
  const id=ctx.t.id; const c=ctxOf(id); if(!c) return; const t=c.t; const was={done:t.done, doneAt:t.doneAt||null, doneOn:t.doneOn||null};
  t.done=!t.done; if(t.done){ t.doneAt=Date.now(); t.doneOn=computeTodayISO(); try{ burstAt(el); }catch(e){} } else { t.doneAt=null; t.doneOn=null; }
  saveDB(); rerenderInPlace();
  const short=t.label.length>32?t.label.slice(0,30)+'…':t.label;
  flashUndo(t.done?`Done · ${short}`:`Not done · ${short}`, ()=>{ const c2=findTaskById(id); if(!c2) return; Object.assign(c2.t, was); saveDB(); render(); }, {label:(t.done?'tick ':'untick ')+'“'+short+'”'});
}

/* ---------- TODAY ---------- */
function notNowIds(){ try{ const o=JSON.parse(lsGet('p28:ui:notnow','null')); return (o&&o.date===todayISO&&Array.isArray(o.ids))?o.ids:[]; }catch(e){ return []; } }
function dayOrder(wk, di){ const all=dayTasks(wk,di); if(wk.key!==todayMonday || di!==todayDayIdx()) return all; const nn=notNowIds(); if(!nn.length) return all; const late=nn.map(id=>all.find(t=>t.id===id)).filter(Boolean); return all.filter(t=>!nn.includes(t.id)).concat(late); }
function doneTodayCount(){ let n=0; Object.values(DB.weeks).forEach(wk=>{ if(!wk||!Array.isArray(wk.days)) return; const f=t=>{ if(t&&t.done&&t.doneOn===todayISO) n++; }; wk.days.forEach(d=>{ (d.personal||[]).forEach(f); (d.work||[]).forEach(f); }); ['future','weekend'].forEach(z=>{ if(wk[z]){ (wk[z].personal||[]).forEach(f); (wk[z].work||[]).forEach(f); } }); }); return n; }
function notNow(id){
  const c=ctxOf(id); if(!c) return; const from=c.idx; c.arr.splice(from,1); c.arr.push(c.t);                // end of its lane: order only, no defers, no hist
  const before=lsGet('p28:ui:notnow',null); const ids=notNowIds().filter(x=>x!==id).concat(id); lsSet('p28:ui:notnow', JSON.stringify({date:todayISO, ids}));
  saveDB(); render();
  flashUndo('Not now · moved to the end of today', ()=>{ const c2=ctxOf(id); if(c2){ c2.arr.splice(c2.idx,1); c2.arr.splice(Math.min(from,c2.arr.length),0,c2.t); } lsSet('p28:ui:notnow', before); saveDB(); render(); }, {label:'Not now'});
}
function renderToday(){
  const wk=weekView(todayMonday), wKey=wk.key, di=todayDayIdx(), d=wk.days[di];
  const now=new Date(); const due=allReminders().filter(x=>new Date(x.t.remind)<=now);
  const dueIds=new Set(due.map(x=>x.t.id));

  const next=undone[0], then=undone.slice(1,3), rest=undone.slice(3); const doneHere=all.filter(t=>t.done);
  const dn=doneTodayCount();
  const head=`<div class="dayhead"><div><h1 class="dow" style="margin:0">${DOWFULL[di]}</h1><div class="date"><b>${d.n} ${d.month}</b></div></div><div class="headright">${dn?`<span class="donechip" id="donechip">${dn} done</span>`:''}${gymTodayHTML()}</div></div>`;
  const pin=(DB.projects||[]).find(p=>p.pinned); let driver='';
  if(pin){ const open=allProjectTasks(pin.id).filter(x=>!x.t.done); if(open.length) driver=`<button class="driver" data-act="openproject" data-pid="${attr(pin.id)}"><span><b>${esc(pin.name)}</b> · next: ${esc(open[0].t.label.slice(0,60))}</span><span class="go" aria-hidden="true">›</span></button>`; }
  let body='';
  if(due.length) body+=`<div class="list" id="duelist" style="margin-bottom:12px">${due.map(x=>taskRow(x.t,{w:x.wk.key,d:x.di},{nosubs:true})).join('')}</div>`;
  body+=apptsTodayHTML();
  if(next){
    const sub=(next.subs||[]).find(s=>!s.done);
    body+=`<div class="eyebrow">Next<span class="ln"></span></div>
      <div class="next ${next.kind==='work'?'kwork':''}" data-w="${wKey}" data-d="${di}" data-id="${attr(next.id)}" data-k="${next.kind}">
        <div class="lane">${laneName(next.kind)}</div>
        <div class="row"><button class="check" data-act="check" aria-label="Complete: ${attr(next.label.slice(0,60))}">${CHK}</button><div class="title" data-act="edit" role="button" tabindex="0">${esc(next.label)}</div></div>
        ${sub?`<div class="step"><b>First step:</b> ${esc(sub.label)}</div>`:''}
        ${undone.length>1?`<div class="acts"><button class="hb" data-act="notnow">Not now</button></div>`:''}
      </div>`;
    if(then.length) body+=`<div class="eyebrow">Then<span class="ln"></span></div>`+listHTML(then,{w:wKey,d:di,k:'mix'},{nosubs:true});
    if(rest.length||doneHere.length){
      body+=`<button class="showfull ${ui.fullDay?'open':''}" data-act="fullday" aria-expanded="${!!ui.fullDay}">${ui.fullDay?'Hide the rest':'Show full day'} ${IC.chev.replace('M9 6l6 6-6 6','M6 9l6 6 6-6')}</button>`;
      if(ui.fullDay){ const p=sortTimed(d.personal), w=sortTimed(d.work);
        if(p.length) body+=`<div class="eyebrow p">Personal<span class="ln"></span></div>`+listHTML(p,{w:wKey,d:di,k:'personal'},{num:true});
        if(w.length) body+=`<div class="eyebrow w">Work<span class="ln"></span></div>`+listHTML(w,{w:wKey,d:di,k:'work'},{num:true}); }
    }
  } else if(all.length){
    body+=`<div class="clearday"><div class="h">Done for today.</div><div>Everything planned for today is ticked.</div></div>`+(doneHere.length?`<div class="eyebrow">Done<span class="ln"></span></div>`+listHTML(doneHere,{w:wKey,d:di,k:'mix'},{nosubs:true}):'');
  } else if(!due.length){
    body+=`<div class="clearday"><div class="h">A clear day.</div><div>Nothing is planned for today. Add something with “today” on the end, or bring a task over from Week+.</div><div style="margin-top:12px"><button class="hb" data-go="weekplus">Open Week+</button></div></div>`;
  }

}

/* ---------- WEEK+ : one board. Every bucket is always in the page; which ones are open is the only difference
   between the short view (Unscheduled, today, the next day, Weekend) and Whole week. ---------- */
function openCount(w, di){ return colArr(w,di,'personal').filter(t=>!t.done).length+colArr(w,di,'work').filter(t=>!t.done).length; }
function boardCols(){
  const wk=weekView(ui.weekKey), nxKey=addDays(ui.weekKey,7), nwk=weekView(nxKey);
  const isThis=ui.weekKey===todayMonday, td=todayDayIdx(), vp=vpName(), plan=(wpMode()==='plan')||!isThis||vp==='phone';
  const dsec=i=>({w:wk, di:i, iso:addDays(ui.weekKey,i), today:isThis&&i===td});
  const dcol=i=>({id:'d'+i, cls:(isThis&&i===td)?'today':'', dw:DOW[i], nn:String(wk.days[i].n), secs:[dsec(i)], today:isThis&&i===td, count:(!isThis||i>=td)?openCount(wk,i):0, chip:i});
  const cols=[{id:'pool', cls:'pool', dw:'Unscheduled', nn:isThis?'':'w/c '+dmon(ui.weekKey), secs:[{w:wk,di:'F'}], open:true, chip:'F', pool:true}];
  const wkdToday=isThis&&td>=5;
  if(!plan && isThis && td>0){
    const last=Math.min(td-1,4); cols.push({id:'past', cls:'past', dw:last===0?'Mon':('Mon–'+DOW[last]), nn:'', secs:Array.from({length:last+1},(_,i)=>Object.assign(dsec(i),{title:DOW[i]+' '+wk.days[i].n})), count:0});
    for(let i=td;i<=4;i++) cols.push(dcol(i));
  } else for(let i=0;i<=4;i++) cols.push(dcol(i));
  cols.push({id:'wkd', cls:'wkd'+(wkdToday?' today':''), dw:'Weekend', nn:'', count:openCount(wk,'W')+openCount(wk,5)+openCount(wk,6), chip:'W', today:wkdToday,
    secs:[{w:wk,di:'W',title:'Either day'}, Object.assign(dsec(5),{title:'Sat '+wk.days[5].n}), Object.assign(dsec(6),{title:'Sun '+wk.days[6].n})]});
  cols.push({id:'nxt', cls:'nxt', dw:'Next week', nn:'Unscheduled · w/c '+dmon(nxKey), secs:[{w:nwk,di:'F'}], count:openCount(nwk,'F'), chip:'N'});
  /* which columns are open */
  let open=new Set(['pool']);
  if(vp==='wide' && plan) cols.forEach(c=>open.add(c.id));
  else if(plan){ [0,1,2,3,4].forEach(i=>open.add('d'+i)); if(wkdToday) open.add('wkd'); }
  else if(td<=3){ open.add('d'+td); open.add('d'+(td+1)); open.add('wkd'); }
  else if(td===4){ open.add('d4'); open.add('wkd'); open.add('nxt'); }
  else { open.add('wkd'); open.add('nxt'); }
  if(vp==='tablet'){ const keep=plan?'d0':(td<=4?'d'+td:'wkd'); open=new Set(['pool', ui.openTabs.size?[...ui.openTabs].pop():keep]); }
  else ui.openTabs.forEach(id=>{ if(open.has(id)) open.delete(id); else open.add(id); });      // a tab he opened (or a column he folded) stays that way
  open.add('pool');
  cols.forEach(c=>{ c.open=open.has(c.id); });
  return {cols, wk, nwk, nxKey, isThis, plan};
}
function secHTML(s, showAll){
  const P=sortTimed(colArr(s.w,s.di,'personal')), W=sortTimed(colArr(s.w,s.di,'work'));
  const po=P.filter(t=>!t.done).length, wo=W.filter(t=>!t.done).length, done=P.length+W.length-po-wo;
  const lanes=po>0 && wo>0 && (po+wo)>5; const sk=s.w.key+'/'+s.di; const show=showAll||s.today||ui.doneOpen.has(sk);
  const lane=(arr,k)=>{ let n=0; const many=(k==='work'?wo:po)>1; return `<div class="list" data-w="${s.w.key}" data-d="${s.di}" data-k="${k}">${arr.map(t=>taskRow(t,{w:s.w.key,d:s.di},{grip:true,num:(t.done||!many)?0:++n})).join('')}</div>`; };

/* ---------- Add: one field, never a question. A day phrase counts only at the very end of a line (V8). ---------- */
const DAYWORDS={mon:0,monday:0,tue:1,tues:1,tuesday:1,wed:2,weds:2,wednesday:2,thu:3,thur:3,thurs:3,thursday:3,fri:4,friday:4,sat:5,saturday:5,sun:6,sunday:6};
const ADD_RE=/^(.*?\S)\s+(?:(?:on|by|for|at the|at|this)\s+)?(today|tomorrow|next week|in [1-8] weeks?|weekend|mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:rsday|rs|r)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)$/i;
function addDefault(){
  const onScreen=(ui.view==='weekplus'||ui.view==='week')?(ui.weekKey||todayMonday):todayMonday;
  if(!isLap() && ui.view==='weekplus' && !ui.oldBoard){ if(ui.chip==='N') return {week:addDays(onScreen,7), di:'F'}; return {week:onScreen, di:ui.chip}; }
  return {week:onScreen, di:'F'};
}
function parseAddLine(line){
  const s=String(line||'').replace(/\s+/g,' ').trim(); if(!s) return null;
  const m=ADD_RE.exec(s); if(!m) return {label:s, at:null};
  const p=m[2].toLowerCase(); const onScreen=(ui.view==='weekplus'||ui.view==='week')?(ui.weekKey||todayMonday):todayMonday; let at=null;
  if(p==='weekend') at={week:onScreen, di:'W'};
  else if(p in DAYWORDS){ const di=DAYWORDS[p]; at=(onScreen!==todayMonday)?{week:onScreen, di}:parseWhen(DOW[di]); }
  else at=parseWhen(p);
  return at?{label:m[1].trim(), at}:{label:s, at:null};
}
function addFromText(text, lane){
  const lines=String(text||'').split(/\n|⏎/).map(parseAddLine).filter(Boolean); if(!lines.length) return 0;
  lane=(lane==='work')?'work':'personal'; const def=addDefault(); const ids=[]; let first=null;
  lines.forEach(L=>{ const at=L.at||def; const wk=ensureWeek(at.week); const t=T(L.label,lane); colArr(wk,at.di,lane).push(t); ids.push(t.id); if(!first) first=at; });
  saveDB(); render();
  const same=lines.every(L=>{ const a=L.at||def; return a.week===first.week && a.di===first.di; });
  const where=same?placeName(first.week, first.di):'several places';
  const msg=(ids.length===1?'Added to ':`Added ${ids.length} tasks to `)+where+' · '+laneName(lane);
  flashUndo(msg, ()=>{ ids.forEach(id=>{ const c=ctxOf(id); if(c) binTask(c); }); saveDB(); render(); flashToast(ids.length===1?'Taken back out · it is in the Bin':'Taken back out · they are in the Bin'); },
    {label:'add “'+lines[0].label.slice(0,30)+'”'+(ids.length>1?' and '+(ids.length-1)+' more':''), change:ids.length===1?()=>{ const c=ctxOf(ids[0]); if(c) openMoveSheet(c); }:null});
  return ids.length;
}

function addTaskTo(wKey, di, kind, label){ label=(label||'').trim(); if(!label) return; const wk=ensureWeek(wKey); const t=T(label,kind); colArr(wk,di,kind).push(t); const id=t.id; saveDB(); render();
  flashUndo('Added to '+placeName(wKey,di)+' · '+laneName(kind), ()=>{ const c=ctxOf(id); if(c){ binTask(c); saveDB(); render(); } }, {label:'add “'+label.slice(0,30)+'”'}); return true; }

  const v=String(el?el.value:(_sheet.pending||'')).replace(/\s*\n\s*/g,' ').trim(); lsSet('p28:ui:sheet',null);
  if(!v || v===c.t.label) return;
  const old=_sheet.orig, id=_sheet.id; c.t.label=v; saveDB(); _sheet.dirty=true;
  setUndo('edit “'+old.slice(0,30)+'”', ()=>{ const c2=findTaskById(id); if(c2){ c2.t.label=old; saveDB(); render(); } });
}
function sheetClosing(){ if(!_sheet) return; flushSheetLabel(); const dirty=_sheet.dirty; _sheet=null; if(dirty) try{ renderView(); }catch(e){} }
window.addEventListener('pagehide', ()=>{ try{ flushSheetLabel(); }catch(e){} });

/* =====================================================================================================
   TIME tab. Lives only here: work time and breaks never appear in Today, Week or Week+. A plan never
   moves a task: it is a view of that day's open tasks, in the order they sit in the other views,
   poured into the work times. Stored (additively) in DB.dayPlans[date] / DB.dayShapes.
   ===================================================================================================== */
function timeDay(){ return ui.timeDay||todayISO; }
function normBlocks(bl){ return (Array.isArray(bl)?bl:[]).map((b,i)=>({id:(b&&b.id)||('b'+(i+1)), start:b&&(b.start||b.s), end:b&&(b.end||b.e), label:(b&&b.label)||''})).filter(b=>/^\d{2}:\d{2}$/.test(b.start||'')&&/^\d{2}:\d{2}$/.test(b.end||'')&&tmin(b.end)>tmin(b.start)).sort((a,b)=>tmin(a.start)-tmin(b.start)); }
function usualShape(){ const s=(DB.dayShapes||[]).find(x=>x&&x.id==='usual'); const bl=s?normBlocks(s.blocks):[]; return {id:'usual', name:(s&&s.name)||'Usual day', blocks:bl.length?bl:[{id:'b1',start:'10:00',end:'14:30',label:''}]}; }
function shapeList(){ return [usualShape()].concat((DB.dayShapes||[]).filter(x=>x&&x.id!=='usual'&&normBlocks(x.blocks).length).map(x=>({id:x.id,name:x.name||'Hours',blocks:normBlocks(x.blocks)}))); }
function planFor(iso){ const p=(DB.dayPlans||{})[iso]; if(p&&Array.isArray(p.blocks)) return {stored:true, shape:p.shape||null, blocks:normBlocks(p.blocks), gaps:Array.isArray(p.gaps)?p.gaps:[], fit:p.fit||null};
  if(localDow(iso)<=4) return {stored:false, shape:'usual', blocks:usualShape().blocks, gaps:[], fit:null}; return {stored:false, shape:null, blocks:[], gaps:[], fit:null}; }
function ensurePlan(iso){ DB.dayPlans=DB.dayPlans||{}; let p=DB.dayPlans[iso]; if(!p||!Array.isArray(p.blocks)){ const v=planFor(iso); p=DB.dayPlans[iso]=Object.assign({}, p||{}, {shape:v.shape, blocks:v.blocks.map(b=>({id:b.id,start:b.start,end:b.end,label:b.label||''})), gaps:[], v:1}); } if(!Array.isArray(p.gaps)) p.gaps=[]; return p; }
function planChange(iso, msg, mutate){ const before=JSON.stringify((DB.dayPlans||{})[iso]||null), shapesBefore=JSON.stringify(DB.dayShapes||null); mutate(); saveDB(); render();
  flashUndo(msg, ()=>{ DB.dayPlans=DB.dayPlans||{}; const b=JSON.parse(before); if(b) DB.dayPlans[iso]=b; else delete DB.dayPlans[iso]; const s=JSON.parse(shapesBefore); if(s) DB.dayShapes=s; else delete DB.dayShapes; saveDB(); render(); }); }
function estOf(t, fit){ const e=fit&&fit.est&&fit.est[t.id]; const v=+e||+t.est||30; return Math.max(5,Math.min(480,v)); }
function timeTasks(iso){ const wkKey=mondayOfISO(iso), di=localDow(iso), wk=weekView(wkKey); return {wkKey, di, wk, tasks:dayOrder(wk,di).filter(t=>!t.done), pool:sortTimed(wk.future.personal).concat(sortTimed(wk.future.work)).filter(t=>!t.done)}; }
/* the fill: in order, never back to an earlier work time; what does not fit is listed, nothing is moved */
function computeFit(iso, P, fit){
  const X=timeTasks(iso); let tasks=X.tasks;
  if(fit && Array.isArray(fit.seq)){ const pos=new Map(fit.seq.map((id,i)=>[id,i])); const base=new Map(tasks.map((t,i)=>[t.id,i])); tasks=tasks.slice().sort((a,b)=>(pos.has(a.id)?pos.get(a.id):1e6+base.get(a.id))-(pos.has(b.id)?pos.get(b.id):1e6+base.get(b.id))); }
  const blocks=P.blocks.map(b=>({b, cap:tmin(b.end)-tmin(b.start), used:0, rows:[]})); let bi=0; const over=[];
  const put=(t,pool)=>{ const e=estOf(t,fit); while(bi<blocks.length && blocks[bi].cap-blocks[bi].used<e) bi++; if(bi>=blocks.length) return false; blocks[bi].rows.push({t, pool, w:X.wkKey, d:pool?'F':X.di}); blocks[bi].used+=e; return true; };
  tasks.forEach(t=>{ if(!put(t,false)) over.push(t); });
  let free=0; for(let i=bi;i<blocks.length;i++) free+=blocks[i].cap-blocks[i].used;
  let pooled=0; if(fit && fit.pool){ for(const t of X.pool){ if(!put(t,true)) break; pooled++; } }
  return {blocks, over, free, pooled, poolOpen:X.pool.length, dayOpen:X.tasks.length, order:blocks.map(x=>({b:x.b.id, ids:x.rows.map(r=>r.t.id)}))};
}
function timeProposal(iso){ try{ const p=JSON.parse(lsGet('p28:ui:timeprop','null')); if(!p||p.date!==iso||!Array.isArray(p.seq)) return null; const d=new Date(+p.at); if(isoOf(d.getFullYear(),d.getMonth(),d.getDate())!==computeTodayISO()){ lsSet('p28:ui:timeprop',null); return null; } return p; }catch(e){ return null; } }
function fitDay(iso){ planChange(iso, 'Day filled from its tasks', ()=>{ const p=ensurePlan(iso); const r=computeFit(iso, planFor(iso), {by:'plain'}); p.fit={at:Date.now(), by:'plain', order:r.order, over:r.over.map(t=>t.id)}; }); }
function nowLine(P){
  const n=new Date(), m=n.getHours()*60+n.getMinutes(), hh=pad(n.getHours())+':'+pad(n.getMinutes()); if(!P.blocks.length) return hh+' now';
  const cur=P.blocks.find(b=>m>=tmin(b.start)&&m<tmin(b.end)); if(cur) return `${hh} now · ${hm(tmin(cur.end)-m)} of work time left before ${cur.end}`;
  const nx=P.blocks.find(b=>tmin(b.start)>m); if(nx) return `${hh} now · ${P.blocks[0]===nx?'work time starts at':'break until'} ${nx.start}`;
  return `${hh} now · work time has finished for today`;
}
function timeRow(r){
  const t=r.t; const sel=`data-w="${r.w}" data-d="${r.d}" data-k="${t.kind}" data-id="${attr(t.id)}"`; const open=ui.estOpen===t.id;
  return `<div class="t ${t.kind==='work'?'kwork':''} ${r.pool?'frompool':''}" ${sel}><button class="check" data-act="check" aria-label="Complete: ${attr(t.label.slice(0,60))}">${CHK}</button><span class="lab" data-act="timeest" role="button" tabindex="0" aria-expanded="${open}"><span class="lt">${esc(t.label)}</span></span></div>`
    +(open?`<div class="estrow" ${sel}><span>How long?</span>${[15,30,60,120].map(n=>`<button class="dchip ${+t.est===n?'on':''}" data-act="setest" data-est="${n}">${n<60?n+' min':(n/60)+' h'}</button>`).join('')}<button class="linkbtn" data-act="edit">Open task</button></div>`:'');
}
function renderTime(){
  const iso=timeDay(), isToday=iso===todayISO; const P=planFor(iso); const prop=timeProposal(iso);
  const fit=prop?{by:'claude', seq:prop.seq, est:prop.est||{}, pool:!!(P.fit&&P.fit.pool)}:P.fit; const R=fit?computeFit(iso,P,fit):null; const X=timeTasks(iso);
  const [y,m,d]=iso.split('-').map(Number); const dow=localDow(iso);
  const shapeName=(()=>{ if(!P.blocks.length) return 'none'; const s=shapeList().find(x=>x.id===P.shape); return s?s.name:'this day only'; })();
  const head=`<div class="timehead"><h1 class="ttl" style="margin-top:0;margin-bottom:0">Time<small>${isToday?'Today · ':''}${DOW[dow]} ${d} ${MON[m-1]}</small></h1><button class="hb icon" data-act="timeprev" aria-label="Previous day">${IC.l}</button><button class="hb icon" data-act="timenext" aria-label="Next day">${IC.r}</button>${isToday?'':`<button class="hb" data-act="timetoday">Today</button>`}</div>`;

function parseRange(s){
  const m=/^\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to|until)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\s*$/i.exec(String(s||'')); if(!m) return null;

  if(a1==='pm'&&h1<12) h1+=12; if(a1==='am'&&h1===12) h1=0; if(a2==='pm'&&h2<12) h2+=12; if(a2==='am'&&h2===12) h2=0;
  if(!a2 && h2*60+m2<=h1*60+m1 && h2<12) h2+=12;
  if(h1>23||h2>24||m1>59||m2>59||(h2===24&&m2>0)) return null; if(h2===24){ h2=23; m2=59; } if(h2*60+m2<=h1*60+m1) return null;
  return {start:pad(h1)+':'+pad(m1), end:pad(h2)+':'+pad(m2)};
}

  for(let k=0;k<cnt;k++){ if(p+46>n || dv.getUint32(p,true)!==0x02014b50) throw new Error('The file could not be read.');
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    if(td.decode(new Uint8Array(buf,p+46,nl))===name){ if(dv.getUint32(off,true)!==0x04034b50) throw new Error('The file could not be read.'); const data=new Uint8Array(buf, off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true), csize); if(method===0) return data; if(method===8) return inflateRaw(data); throw new Error('The file is packed in a way this page cannot read.'); }

async function rowsFromDocx(file){

  const cellText=tc=>[...tc.getElementsByTagName('w:p')].map(p=>{ let s=''; const walk=nd=>{ for(const c of nd.childNodes){ if(c.nodeName==='w:t') s+=c.textContent; else if(c.nodeName==='w:tab'||c.nodeName==='w:br'||c.nodeName==='w:cr') s+=' '; else if(c.nodeType===1) walk(c); } }; walk(p); return s; }).join(' ');

  const under=(el,nm)=>{ for(let a=el.parentNode;a;a=a.parentNode){ if(a.nodeName===nm) return true; } return false; };
  const tables=[...doc.getElementsByTagName('w:tbl')].filter(t=>!under(t,'mc:Fallback')).map(tbl=>kids(tbl,'w:tr').map(tr=>kids(tr,'w:tc').map(cellText)).filter(c=>c.length)).filter(t=>t.length);

  const first=t=>t.find(r=>r.some(c=>String(c).trim()));

  rows.skipped=headed.length?tables.filter(t=>!headed.includes(t) && t.some(r=>jobLike(r[0]))).length:0;

}
/* ---------- job changes this device has made and not yet pushed (a device-only note, key p28:od:mine) ----------

   changes are noted here as he makes them, put back after that kind of adopt (and then pushed), and forgotten as soon
   as a push has carried them. The note is never in the store and is ignored when this device has nothing unpushed. */
const MINE_KEY='p28:od:mine';
function mineRaw(){ try{ return localStorage.getItem(MINE_KEY); }catch(e){ return null; } }
function mineRead(){ try{ const m=JSON.parse(mineRaw()||'null'); return (m&&typeof m==='object')?m:null; }catch(e){ return null; } }

function mineJob(id, job){ if(!mineOn()) return; const m=mineRead()||{}; m.jobs=m.jobs||{}; m.jobs[id]=job?{no:job.no,name:job.name}:null; mineWrite(m); }
function mineList(){ if(!mineOn()) return; const m=mineRead()||{}; m.jl=Date.now(); mineWrite(m); }
function minePushed(rawAtPush){ if(rawAtPush!=null && mineRaw()===rawAtPush) mineClear(); }
function mineReapply(remote, myList, dirty){ const m=mineRead(); if(!m) return false; if(!dirty){ mineClear(); return false; } let ch=false;
  if(m.jl){ const rAt=(remote&&remote.jobList&&+remote.jobList.refreshedAt)||0; if(m.jl>rAt && JSON.stringify(myList===undefined?null:myList)!==JSON.stringify(DB.jobList===undefined?null:DB.jobList)){ if(myList===undefined) delete DB.jobList; else DB.jobList=myList; ch=true; } }
  Object.keys(m.jobs||{}).forEach(id=>{ const c=findTaskById(id); if(!c) return; const want=m.jobs[id]; if(JSON.stringify(c.t.job||null)===JSON.stringify(want||null)) return; if(want) c.t.job={no:want.no,name:want.name}; else delete c.t.job; ch=true; });

function jobItems(){ return (DB.jobList&&Array.isArray(DB.jobList.items))?DB.jobList.items:[]; }
function jobListLine(){ const L=DB.jobList; if(!L||!Array.isArray(L.items)) return 'No job list yet';
  const day=ts=>{ const d=new Date(ts); const iso=isoOf(d.getFullYear(),d.getMonth(),d.getDate()); return iso===todayISO?'today':d.getDate()+' '+MON[d.getMonth()]; };

/* ---------- Photo background: this device only (IndexedDB "p28-ui"), never localStorage, never the task store ----------
   Two modes: 'soft' (behind everything, blurred, veiled with the look's background) and 'band' (top strip only).
   Readability is enforced: the veil is strengthened until every text colour that can sit on the bare page passes 4.5:1
   against the darkest and the lightest parts of the photo. Columns and cards stay solid in both modes. */
let _photo=null, _photoURL=null, _photoSession=false, _photoErr='', _photoVeil=0, _photoWhy='';
function pdb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('p28-ui',1); r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error||new Error('idb')); r.onblocked=()=>rej(new Error('idb')); }catch(e){ rej(e); } }); }

const PHOTO_MAX_BYTES=350*1024, PHOTO_MAX_SIDE=1600;

  if(!src){ src=await new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('decode')); }; im.src=u; }); }

  const s=document.createElement('canvas'); s.width=48; s.height=48; const sx=s.getContext('2d'); sx.drawImage(c,0,0,48,48); const d=sx.getImageData(0,0,48,48).data; const px=[]; for(let i=0;i<d.length;i+=4) px.push([d[i],d[i+1],d[i+2]]);

function relLum(c){ const f=v=>{ v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }; return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2]); }

  try{ if(!_photo && indexedDB.databases){ const dbs=await indexedDB.databases();            // never open a database that is not there: opening would create it
      if(dbs.some(d=>d.name==='p27-ui')){ const rec=await new Promise(res=>{ let r; try{ r=indexedDB.open('p27-ui'); }catch(e){ return res(null); }
          r.onupgradeneeded=()=>{ try{ r.transaction.abort(); }catch(e){} }; r.onerror=()=>res(null); r.onblocked=()=>res(null);
          r.onsuccess=()=>{ const db=r.result; try{ if(!db.objectStoreNames.contains('kv')){ db.close(); return res(null); } const q=db.transaction('kv','readonly').objectStore('kv').get('photo'); q.onsuccess=()=>{ const v=q.result; db.close(); res(v||null); }; q.onerror=()=>{ db.close(); res(null); }; }catch(e){ try{ db.close(); }catch(_){} res(null); } }; });
        if(rec && rec.buf && rec.stats){ _photo=rec; if(_photoURL){ try{ URL.revokeObjectURL(_photoURL); }catch(e){} _photoURL=null; } photoApply(); await photoStore(); came.push('photo'); } } } }catch(e){}
  return came; }

/* ---------- "A newer version is ready" ----------
   Each build carries its own mark (the <meta name="p28-build"> near the top of the page). On opening, and when the page comes
   back into view (at most every five minutes), the first few thousand bytes of the page on the server are read and the mark
   compared. Nothing is fetched on a timer and nothing here ever touches a stored task. */
const P28_BUILD='b59b9268';
let _newBuild=null, _updAt=0, _updBusy=false, _updNote='', _updAnyway=false, _lastKeyAt=0, _updT=null;
['keydown','input','compositionstart'].forEach(ev=>document.addEventListener(ev, ()=>{ _lastKeyAt=Date.now(); }, true));
function buildMarkIn(text){ const m=String(text||'').slice(0,8000).match(/<meta name="p28-build" content="([^"]+)"/); return m?m[1]:null; }
async function updCheck(why){ if(_newBuild || _updBusy) return; try{ if(!navigator.onLine) return; }catch(e){} if(why!=='open' && Date.now()-_updAt<5*60*1000) return; _updAt=Date.now();
  try{ const r=await fetch('./index.html?p28check=1', { cache:'no-store', headers:{ Range:'bytes=0-4095' } }); if(!r.ok) return; const mark=buildMarkIn(await r.text()); if(mark && mark!==P28_BUILD){ _newBuild=mark; updWhenQuiet(); } }catch(e){} }
/* quiet = no sheet open, nothing being dragged, no key pressed in the last five seconds */
function updQuiet(){ try{ if(dlg && dlg.open) return false; if(dragging) return false; }catch(e){} return Date.now()-_lastKeyAt>=5000; }
function updWhenQuiet(){ clearTimeout(_updT); if(!_newBuild || document.getElementById('updline')) return; if(updQuiet()) updRender(); else _updT=setTimeout(updWhenQuiet, 1000); }
function updUnsent(){ try{ return !!(odState.connected && odState.live && (_pushPending || odState.syncing || (Number.isInteger(DB.rev) && Number.isInteger(odState.baseRev) && DB.rev!==odState.baseRev))); }catch(e){ return false; } }
function updRender(){ let el=document.getElementById('updline'); if(!el){ el=document.createElement('div'); el.id='updline'; el.setAttribute('role','status'); document.body.insertBefore(el, document.body.firstChild); document.body.classList.add('hasupd'); }
  el.innerHTML=`<span class="msg">${esc(_updNote||'A newer version is ready')}</span><button type="button" id="updgo"${_updBusy?' disabled':''}>${_updBusy?'Reloading…':(_updAnyway?'Reload anyway':'Reload')}</button>`;
  el.querySelector('#updgo').addEventListener('click', updGo); try{ document.documentElement.style.setProperty('--updh', el.offsetHeight+'px'); }catch(e){} }
async function updGo(){ if(_updBusy) return; _updBusy=true; updRender();
  /* 1. anything not yet sent to OneDrive is sent first; if it cannot be, say so and let him decide (it is saved on the device either way) */
  if(!_updAnyway && updUnsent()){ try{ _pushPending=true; clearTimeout(_syncT); odPush(); }catch(e){} const t0=Date.now(); while(updUnsent() && Date.now()-t0<6000) await new Promise(r=>setTimeout(r,250));
    if(updUnsent()){ _updBusy=false; _updAnyway=true; _updNote='Your last changes are safe on this '+devWord()+' but have not reached OneDrive yet.'; updRender(); return; } }
  /* 2. fetch the new page now, check it really is the newer one, put it in the kept copy, then reload onto it */
  try{ const r=await fetch('./index.html?p28check=1', { cache:'reload' }); const t=r.ok?await r.text():''; const mark=buildMarkIn(t); if(!r.ok || !mark || mark===P28_BUILD) throw new Error('not there yet');     // the same address that showed the newer mark
    try{ if('caches' in window){ const c=await caches.open(P28_CACHE); const h={ 'content-type':'text/html; charset=utf-8' }; const lm=r.headers.get('last-modified'); if(lm) h['last-modified']=lm; const mk=()=>new Response(t, { headers:h });
        await c.put('./index.html', mk()); await c.put('./', mk()); await c.put('./__kept-once', new Response('1')); } }catch(e){}       // the worker hands over exactly this copy on the reload that follows
  }catch(e){ _updBusy=false; _updNote='Can’t reach the new version just now. Try again when you are online.'; updRender(); return; }
  location.reload(); }
function versionLine(){ return 'Planner 2.8 · version '+P28_BUILD; }
try{ v28AfterView(); }catch(e){}      // the first screen was drawn before this part of the page was ready
setTimeout(()=>{ updCheck('open'); }, 2500);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) updCheck('view'); });
window.addEventListener('online', ()=>{ updCheck('view'); });
Object.assign(window.__p28, { openBring27, bringCounts, bringSources, bringOfferOn, updCheck, updState:()=>({ build:P28_BUILD, newBuild:_newBuild, shown:!!document.getElementById('updline'), unsent:updUnsent() }) });

// Register the service worker (offline-first). Harmless if unsupported.
/* 2.7 (review item 7): the live planner's service worker deletes every cache not named planner-v1 when it
   activates, so this copy's shell cache can vanish. On each online open, re-add it if it is missing. */
try{ if(navigator.onLine && 'caches' in window){ caches.has('planner28-v1').then(h=>{ if(!h) return caches.open('planner28-v1').then(c=>c.addAll(['./','./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png','./apple-touch-icon.png'])); }).catch(()=>{}); } }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
